{% extends "base.html" %} {% block title %}Passwort ändern — Spelunke{% endblock %} {% block
content %}
<hgroup>
    <h1>Passwort ändern</h1>
    <p class="hub-muted">
        Aktuelles Passwort bestätigen, dann ein neues setzen (mindestens {{ min_len }} Zeichen).
        Alle anderen Sitzungen dieses Kontos werden dabei beendet.
    </p>
</hgroup>

<form method="post" action="/account/password" style="max-width: 32rem">
    <label>
        Aktuelles Passwort
        <input
            name="current"
            type="password"
            autocomplete="current-password"
            required
            autofocus
        />
    </label>
    <label>
        Neues Passwort
        <input
            name="new_password"
            type="password"
            autocomplete="new-password"
            minlength="{{ min_len }}"
            required
        />
    </label>
    <label>
        Neues Passwort wiederholen
        <input
            name="confirm"
            type="password"
            autocomplete="new-password"
            minlength="{{ min_len }}"
            required
        />
    </label>
    <button type="submit">Passwort ändern</button>
</form>
{% endblock %}
