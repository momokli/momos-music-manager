{# htmx comment-template preview trigger + target (issue #670). Expects `c` in
   scope (one template card). #}
<button
    type="button"
    class="secondary outline"
    hx-post="/comment-templates/{{ c.id }}/preview"
    hx-trigger="click"
    hx-target="#preview-ct-{{ c.id }}"
    hx-swap="innerHTML"
>
    Vorschau
</button>
<div id="preview-ct-{{ c.id }}" class="hub-preview"></div>
