{# Quick-tag form loaded into `.hub-ta` on click (#318). #}
<div class="hub-ta hub-ta-open hub-ta-tag">
    {% include "_partials/tag_input.html" %}
    <button
        type="button"
        class="hub-ta-btn hub-ta-cancel"
        hx-get="/track/{{ id }}/actions"
        hx-target="closest .hub-ta"
        hx-swap="innerHTML"
        aria-label="Abbrechen"
    >
        ×
    </button>
</div>
