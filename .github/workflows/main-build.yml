name: Main Build (DMG)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package DMG
        run: ./scripts/package-macos.sh

      - name: Compute suffixed DMG name
        id: dmg
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION=$(cargo metadata --no-deps --format-version 1 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          BASE="target/Momo's-Music-Manager-v${VERSION}.dmg"
          SUFFIXED="target/Momo's-Music-Manager-v${VERSION}-main-${SHORT_SHA}.dmg"
          cp "$BASE" "$SUFFIXED"
          echo "short_sha=${SHORT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "suffixed_dmg=${SUFFIXED}" >> "${GITHUB_OUTPUT}"
          ls -lh "$SUFFIXED"

      - name: Publish to rolling latest-main pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-main"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --prerelease \
              --target main \
              --title "Latest main build (rolling)" \
              --notes "Automatischer Build des aktuellen main-Standes. Ad-hoc-signiert, nicht notarized."
          fi
          gh release upload "$TAG" "${{ steps.dmg.outputs.suffixed_dmg }}" --clobber
          # Stable filename for the landing page download button (name changes every build).
          STABLE_DMG="target/Momo's-Music-Manager-latest.dmg"
          cp "${{ steps.dmg.outputs.suffixed_dmg }}" "$STABLE_DMG"
          gh release upload "$TAG" "$STABLE_DMG" --clobber

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: momos-music-manager-dmg
          path: ${{ steps.dmg.outputs.suffixed_dmg }}
          if-no-files-found: error
