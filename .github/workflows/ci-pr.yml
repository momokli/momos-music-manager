name: CI (PR)

# Required-Checks für Pull Requests gegen `main`.
#
# Prueft den Stack: `music-hub/` und `music-api/` sind eigenstaendige Crates
# (kein gemeinsamer Root-Workspace mehr — der Legacy-MMM-Crate wandert nach
# `legacy/mmm/`). Jeder Crate baut/testet aus seinem eigenen Verzeichnis.
#
# Bewusst KEINE `paths`-Filter auf den Required-Jobs: ein geskippter Check ist
# nicht "grün" — der PR-Gate mergt bei `CLEAN` nur, wenn die Checks tatsächlich
# gelaufen und grün sind.
#
# `fmt` und `clippy` sind bewusst NICHT required (continue-on-error): der
# Bestand ist noch nicht rustfmt-/clippy-clean (cargo fmt --check meldet ~296
# Stellen). Vor dem Hochstufen erst einmalig aufräumen.

on:
  # Bewusst OHNE `branches`-Filter: sonst liefe die CI auf gestackten PRs nicht
  # (Basis = Vorgaenger-Branch statt `main`). Gerade dort braucht man sie, weil
  # `runner-*.sh` Stacktiefe <= 3 faehrt.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build + Test (cargo)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            music-hub -> target
            music-api -> target
            kellner -> target
          key: ci-pr
      # metaflac/exiftool/ffmpeg decken die Media-Pfade im Stack ab (Datei- und
      # Stream-Metadaten in `music-hub` und `music-api`).
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flac ffmpeg libimage-exiftool-perl
      - name: cargo build + test (music-hub)
        working-directory: music-hub
        run: cargo build --locked && cargo test --locked
      - name: cargo build + test (music-api)
        working-directory: music-api
        run: cargo build --locked && cargo test --locked
      - name: cargo build + test (kellner)
        working-directory: kellner
        run: cargo build --locked && cargo test --locked

  fmt:
    name: cargo fmt (informativ)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Step-level continue-on-error: der Job bleibt gruen, der Check erscheint
      # nicht als Fehler (job-level `continue-on-error` wuerde als "failed check"
      # angezeigt und koennte versehentlich als Required-Check gesetzt werden).
      - continue-on-error: true
        working-directory: music-hub
        run: cargo fmt --all -- --check
      - continue-on-error: true
        working-directory: music-api
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy (informativ)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            music-hub -> target
            music-api -> target
          key: ci-pr
      # Step-level continue-on-error: der Job bleibt gruen, der Check erscheint
      # nicht als Fehler (job-level `continue-on-error` wuerde als "failed check"
      # angezeigt und koennte versehentlich als Required-Check gesetzt werden).
      - continue-on-error: true
        working-directory: music-hub
        run: cargo clippy --locked --all-targets
      - continue-on-error: true
        working-directory: music-api
        run: cargo clippy --locked --all-targets
