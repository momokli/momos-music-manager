name: music-api release

# Publishes the music-api binary for the target host.
#
# * `push` on `api-v*` is the real trigger: build the static musl binary, then
#   attach it (+ SHA256SUMS) to the release. The tag is the truth for releases —
#   `build.rs` embeds `MUSIC_API_VERSION` from it (docs/stack-versioning.md).
# * `pull_request` (path-filtered) proves the build *before* a tag exists; the
#   release job is skipped there.
# * `workflow_dispatch` allows a manual run from the default branch.
#
# Why musl: the host (music-catalog) has no Rust toolchain and no Docker, so the
# deploy ships one static binary (`music-api/deploy/setup.sh`). ffmpeg/ffprobe/
# flac stay host-provided binaries, they are not linked into the crate.
#
# Why the explicit baseline (`RUSTFLAGS`/`CFLAGS_*` below): the host is a
# `Common KVM processor` — SSE2 only, no SSE4.2, no AVX. The first release
# (api-v0.6.0) died on startup with `SIGILL` in a `vpcmpeqd %ymm…` instruction
# inside SQLite's amalgamation, i.e. the bundled C had been auto-vectorised with
# AVX. Pinning `target-cpu=x86-64` for rustc and `-march=x86-64` for the C
# compiler removes the guesswork: the artefact targets the baseline the host
# actually has.

on:
  push:
    tags: ["api-v*"]
  pull_request:
    paths:
      - "music-api/**"
      - ".github/workflows/api-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Both are needed: rustc for the crate, CFLAGS for the bundled SQLite (`cc`
  # crate). `-mno-*` is belt and braces in case an earlier flag re-enables them.
  RUSTFLAGS: "-C target-cpu=x86-64"
  CFLAGS_x86_64_unknown_linux_musl: "-O2 -march=x86-64 -mtune=generic -mno-avx -mno-avx2 -mno-avx512f"

jobs:
  build:
    name: music-api linux-x86_64-musl
    runs-on: ubuntu-latest
    # Every `run` step is relative to the crate (like `ci-pr.yml`). `uses` steps
    # are NOT affected, so the artefact path below is spelled from the repo root.
    defaults:
      run:
        working-directory: music-api
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` needs the tags, otherwise build.rs falls back to the
          # bare SHA (the traceability promise in docs/stack-versioning.md).
          fetch-depth: 0

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: music-api -> target

      - name: Show the codegen baseline
        run: |
          rustc --print cfg --target x86_64-unknown-linux-musl | grep target_feature
          echo "RUSTFLAGS=$RUSTFLAGS"

      # A tag must not publish code that does not even compile its tests.
      - name: Compile the tests
        run: cargo test --locked --target x86_64-unknown-linux-musl --no-run

      # `MUSIC_API_VERSION` from the tag is what build.rs embeds. Off a tag it must
      # stay unset: passing an empty string would override the dev fallback and
      # make `--version` report an empty version.
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/api-v* ]]; then
            export MUSIC_API_VERSION="${GITHUB_REF_NAME#api-v}"
          fi
          cargo build --release --locked --target x86_64-unknown-linux-musl
          BIN="target/x86_64-unknown-linux-musl/release/music-api"
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          ls -l "$BIN" | awk '{print "size:", $5, "bytes"}'

      # The host cannot execute AVX, and a SIGILL on startup is how that shows up
      # (api-v0.6.0, in SQLite's amalgamation). This reports any remaining
      # ymm-register code together with the symbol it lives in — runtime-gated
      # assembly (ring's perlasm) is fine, unguarded compiler vectorisation is not.
      # It is informational because only running the artefact on the host decides.
      - name: Report AVX codegen
        shell: bash
        run: |
          set -euo pipefail
          if objdump -d "$BIN" | grep -qE 'v[a-z0-9]+\s+%ymm'; then
            echo "::warning::ymm-register code present — check the enclosing symbols below"
            objdump -d "$BIN" | awk '/^[0-9a-f]+ <.*>:/{sym=$0} /\s%ymm/{if (sym!=last) { print sym; last=sym } print; c++} c>=8{exit}'
          else
            echo "no ymm-register code found"
          fi

      - name: Smoke test (run the binary)
        shell: bash
        run: |
          set -euo pipefail
          "$BIN" --version
          # The version must carry the tag (or the dev fallback), never `unknown`.
          if [[ "${GITHUB_REF}" == refs/tags/api-v* ]]; then
            "$BIN" --version | grep -q "${GITHUB_REF_NAME#api-v}"
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/api-v* ]]; then
            VER="${GITHUB_REF_NAME#api-v}"
          else
            VER="dev-$(git rev-parse --short=8 HEAD)"
          fi
          NAME="music-api-${VER}-x86_64-unknown-linux-musl"
          mkdir -p dist
          cp "$BIN" "dist/${NAME}"
          # Deploy material travels with the binary: the deploy host has no repo.
          cp deploy/setup.sh deploy/music-api.service deploy/Caddyfile.snippet \
             .env.example "dist/"
          (cd dist && tar czf "${NAME}.tar.gz" "${NAME}" setup.sh music-api.service \
             Caddyfile.snippet .env.example)
          ls -l dist/
          echo "ARTIFACT=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: music-api-linux-x86_64-musl
          path: music-api/dist/*
          if-no-files-found: error
          # `.env.example` is a dotfile; without this the loose copy is dropped.
          include-hidden-files: true

  # Attaches everything to the release — tag builds only.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/api-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          ls -l dist
          (cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)

      - name: Attach to the release
        # No checkout in this job, so `gh` needs the repo spelled out.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "$TAG" --notes "music-api $TAG (see music-api/CHANGELOG.md)"
          gh release upload "$TAG" dist/* --clobber
