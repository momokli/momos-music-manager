name: Hub CI

# CI for the standalone `music-hub` crate (issue M1-1). It is a separate crate,
# not a member of the root workspace, so it builds from its own directory.

on:
  pull_request:
    paths:
      - 'music-hub/**'
      - '.github/workflows/hub-ci.yml'
  push:
    branches: [main]
    paths:
      - 'music-hub/**'
      - '.github/workflows/hub-ci.yml'

permissions:
  contents: read

concurrency:
  group: hub-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: music-hub

jobs:
  build-test:
    name: Build + Test (hub)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: music-hub -> target
          key: hub-ci
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked
