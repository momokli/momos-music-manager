[package]
name = "music-api-client"
version = "0.1.0"
edition = "2024"
description = "HTTP client for the music-api service (Deezer metadata, audio bytes, orders)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
urlencoding = "2"
