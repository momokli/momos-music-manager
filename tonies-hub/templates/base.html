<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Tonies-Hub{% endblock %}</title>
    <style>
      :root {
        --bg: #fffdf7;
        --fg: #2b2b2b;
        --muted: #6b6b6b;
        --accent: #d9480f;
        --card: #ffffff;
        --border: #e6dfd2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 17px;
        line-height: 1.5;
        min-height: 100vh;
        padding:
          calc(1rem + env(safe-area-inset-top))
          calc(1rem + env(safe-area-inset-right))
          calc(1.5rem + env(safe-area-inset-bottom))
          calc(1rem + env(safe-area-inset-left));
      }
      main { max-width: 36rem; margin: 0 auto; }
      h1 { font-size: 1.5rem; margin: 0 0 1rem; color: var(--accent); }
      h2 { font-size: 1.15rem; margin: 1.5rem 0 0.5rem; }
      p { margin: 0 0 0.75rem; }
      a { color: var(--accent); }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
      }
      .muted { color: var(--muted); font-size: 0.95rem; }
      .error {
        color: #b00020;
        background: #fdecef;
        border: 1px solid #f5c2cb;
        border-radius: 8px;
        padding: 0.6rem 0.75rem;
        margin: 0 0 1rem;
      }
      label { display: block; font-weight: 600; margin: 0 0 0.25rem; }
      input[type="text"], input[type="password"] {
        width: 100%;
        min-height: 44px;
        font-size: 17px;
        padding: 0.5rem 0.65rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        margin: 0 0 1rem;
      }
      button {
        min-height: 44px;
        width: 100%;
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 0.5rem 1rem;
      }
      button:active { filter: brightness(0.9); }
      footer { max-width: 36rem; margin: 2rem auto 0; color: var(--muted); font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>Tonies-Hub · eigener Dienst · keine Verbindung zum Musik-Hub</footer>
  </body>
</html>
