[package]
name = "momos-music-manager"
version = "0.5.0"
edition = "2024"
description = "Momo's Music Manager - Multi-service library sync and harmonic discovery for DJs"

[dependencies]
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1.0.69"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter", "fmt"]}
rspotify = "0.15.1"
axum = { version = "0.8.6", features = ["ws", "multipart"] }
askama = "0.14"

tower = "0.5.2"
hyper = "1.7.0"
tokio-stream = { version = "0.1.17", features = ["sync"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "cookies"] }
dotenvy = "0.15"
clap = { version = "4.5.50", features = ["derive"] }
sha2 = "0.10"
chrono = "0.4"
walkdir = "2.5"
shellexpand = "3.1"
tempfile = "3.8"
soundcloud-rs = "0.14.0"
youtube = "0.1.1"
roxmltree = "0.20"
lofty = "0.20"
tokio-tungstenite = "0.21"
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
dirs = "6.0"
rust-embed = "8"

# ML / Embeddings
candle-core = "0.8"
candle-transformers = "0.8"
candle-nn = "0.8"
hf-hub = "0.4"
tokenizers = "0.21"

[dev-dependencies]
tokio-test = "0.4"
