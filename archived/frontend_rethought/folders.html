<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Folders — Music Manager</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <nav id="main-nav"></nav>

        <div class="container">
            <div class="page-header">
                <h1>Folders</h1>
                <p class="subtitle">
                    Manage music folders for scanning local files
                </p>
            </div>

            <div class="error-message" id="error-message"></div>

            <div class="toolbar">
                <input
                    type="text"
                    id="search-input"
                    class="input-text"
                    placeholder="Search folders..."
                />
                <button id="search-btn" class="btn">
                    <i class="fas fa-search"></i> Search
                </button>
                <button id="add-folder-btn" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Folder
                </button>
            </div>

            <div class="stats-row">
                <div class="stats-group">
                    <span>Total Folders: <strong id="total-folders">0</strong></span>
                </div>
            </div>

            <div id="folders-content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading folders...</p>
                </div>
            </div>

            <footer>
                <p>
                    Backend API:
                    <code style="color: var(--text-muted)"
                        >http://localhost:3000/api</code
                    >
                </p>
            </footer>
        </div>

        <!-- Add/Edit Folder Modal -->
        <div class="modal" id="folder-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-title">Add Folder</h3>
                    <button class="close-btn" id="close-modal-btn">&times;</button>
                </div>
                <div id="modal-body">
                    <div class="form-group">
                        <label for="folder-path">Path</label>
                        <input
                            type="text"
                            id="folder-path"
                            class="input-text"
                            placeholder="/path/to/music/folder"
                        />
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="scan-recursive" checked />
                            Scan Recursive
                        </label>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="fixed-extensions" />
                            Fixed Extensions (only scan files with selected extensions)
                        </label>
                    </div>
                    <div class="form-group">
                        <label>Extensions</label>
                        <div style="margin-bottom: var(--space-2); display: flex; gap: var(--space-2);">
                            <button id="select-all-ext-btn" class="btn btn-sm">
                                <i class="fas fa-check-square"></i> Select All
                            </button>
                            <button id="deselect-all-ext-btn" class="btn btn-sm">
                                <i class="fas fa-square"></i> Deselect All
                            </button>
                        </div>
                        <div id="extensions-container"></div>
                    </div>
                    <div class="modal-actions">
                        <button id="save-folder-btn" class="btn btn-primary" style="flex: 1;">
                            <i class="fas fa-save"></i> Save
                        </button>
                        <button id="cancel-folder-btn" class="btn" style="flex: 1;">
                            Cancel
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script type="module" src="folders.js"></script>
    </body>
</html>
