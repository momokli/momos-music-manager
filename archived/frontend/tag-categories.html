<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Manager POC - Tag Categories</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <a href="index.html" style="display: inline-block; margin-bottom: 20px; color: #3b82f6; text-decoration: none;">
                <i class="fas fa-arrow-left"></i> Back to Services
            </a>

            <header>
                <h1><i class="fas fa-tags"></i> Tag Categories</h1>
                <p class="subtitle">
                    View and search tag categories (Setlist, Phase, Mood, Vibe, Merkmal)
                </p>
            </header>

            <div class="error-message" id="error-message"></div>

            <div style="background: #1a1a2e; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155;">
                <div style="display: flex; gap: 10px; margin-bottom: 15px">
                    <input type="text" id="search-input" placeholder="Search by name, prefix, or icon..." style="flex: 1; padding: 12px 16px; border-radius: 8px; background: #0f172a; border: 1px solid #334155; color: white; font-size: 14px;" />
                    <button id="search-button" style="padding: 12px 24px; border-radius: 8px; background: #3b82f6; color: white; border: none; cursor: pointer; font-weight: 600;">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
            </div>

            <div id="tag-categories-content" style="background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #334155; min-height: 400px;">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>Loading tag categories...</p>
                </div>
            </div>

            <div id="tag-categories-table-container" style="display: none; margin-top: 20px">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0; color: #cbd5e1">
                        <span id="tag-categories-count">0</span> Tag Categories
                    </h3>
                </div>

                <div style="overflow-x: auto">
                    <table style="width: 100%; border-collapse: collapse; color: #cbd5e1; font-size: 14px;">
                        <thead>
                            <tr style="background: #0f172a">
                                <th style="padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; font-weight: 600;">ID</th>
                                <th style="padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; font-weight: 600;">Name</th>
                                <th style="padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; font-weight: 600;">Prefix</th>
                                <th style="padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; font-weight: 600;">Icon</th>
                                <th style="padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; font-weight: 600;">Default</th>
                                <th style="padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; font-weight: 600;">Sort Order</th>
                            </tr>
                        </thead>
                        <tbody id="tag-categories-table-body"><!-- Tag categories will be inserted here --></tbody>
                    </table>
                </div>

                <div id="no-tag-categories" style="text-align: center; padding: 40px 20px; color: #94a3b8; display: none;">
                    <i class="fas fa-tags" style="font-size: 48px; margin-bottom: 15px"></i>
                    <h3 style="margin: 0 0 10px 0; color: #cbd5e1">No tag categories found</h3>
                    <p>Try a different search term or check if the backend is running.</p>
                </div>
            </div>
        </div>

        <script src="tag-categories.js"></script>
    </body>
</html>
