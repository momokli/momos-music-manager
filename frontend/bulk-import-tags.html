<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Manager - Bulk Import Tags</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="style.css" />
        <style>
            .category-card {
                background: #1a1a2e;
                border-radius: 12px;
                padding: 16px;
                margin-bottom: 16px;
                border: 1px solid #334155;
            }

            .category-header {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 10px;
                color: #f1f5f9;
                font-size: 1.1rem;
                font-weight: 600;
            }

            .category-header i {
                font-size: 1.2rem;
                color: #3b82f6;
            }

            .default-badge {
                font-size: 0.7rem;
                background: #334155;
                color: #94a3b8;
                padding: 2px 8px;
                border-radius: 10px;
                text-transform: uppercase;
            }

            .tag-textarea {
                width: 100%;
                background: #0f172a;
                border: 1px solid #1e293b;
                border-radius: 8px;
                color: #e2e8f0;
                font-family: monospace;
                font-size: 0.9rem;
                padding: 12px;
                resize: vertical;
                box-sizing: border-box;
                outline: none;
            }

            .tag-textarea:focus {
                border-color: #3b82f6;
            }

            .tag-count {
                text-align: right;
                color: #64748b;
                font-size: 0.8rem;
                margin-top: 6px;
            }

            .btn-primary {
                display: block;
                width: 100%;
                padding: 16px 32px;
                background: linear-gradient(135deg, #3b82f6, #8b5cf6);
                color: white;
                border: none;
                border-radius: 12px;
                font-size: 1.2rem;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.2s;
                margin: 24px 0;
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                filter: brightness(1.1);
            }

            .btn-primary:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

            /* Results */
            #results-container {
                display: none;
                margin-top: 32px;
            }

            .results-header {
                color: #f1f5f9;
                font-size: 1.4rem;
                font-weight: 700;
                margin-bottom: 16px;
            }

            .results-stats {
                display: flex;
                gap: 16px;
                margin-bottom: 24px;
                flex-wrap: wrap;
            }

            .stat {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 12px 20px;
                border-radius: 10px;
                font-size: 1rem;
                font-weight: 600;
            }

            .stat-matched {
                background: rgba(16, 185, 129, 0.15);
                color: #6ee7b7;
                border: 1px solid rgba(16, 185, 129, 0.3);
            }

            .stat-conflict {
                background: rgba(245, 158, 11, 0.15);
                color: #fbbf24;
                border: 1px solid rgba(245, 158, 11, 0.3);
            }

            .stat-new {
                background: rgba(59, 130, 246, 0.15);
                color: #60a5fa;
                border: 1px solid rgba(59, 130, 246, 0.3);
            }

            .stat-count {
                font-size: 1.4rem;
            }

            .result-section {
                margin-bottom: 20px;
            }

            .result-section-header {
                color: #94a3b8;
                font-size: 0.9rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 8px;
                padding-bottom: 4px;
                border-bottom: 1px solid #1e293b;
            }

            .result-list {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .result-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px 12px;
                border-radius: 6px;
                background: rgba(15, 23, 42, 0.5);
                transition: all 0.2s;
                flex-wrap: wrap;
            }

            .result-item-matched {
                border-left: 3px solid #10b981;
            }

            .result-item-conflict {
                border-left: 3px solid #f59e0b;
            }

            .result-item-not_found {
                border-left: 3px solid #3b82f6;
            }

            .result-name {
                color: #e2e8f0;
                font-family: monospace;
                font-weight: 500;
                min-width: 150px;
            }

            .result-badge {
                font-size: 0.8rem;
                padding: 2px 10px;
                border-radius: 12px;
                font-weight: 500;
            }

            .badge-matched {
                background: rgba(16, 185, 129, 0.2);
                color: #6ee7b7;
            }

            .badge-conflict {
                background: rgba(245, 158, 11, 0.2);
                color: #fbbf24;
            }

            .badge-new {
                background: rgba(59, 130, 246, 0.2);
                color: #60a5fa;
            }

            .result-actions {
                display: flex;
                gap: 6px;
                margin-left: auto;
            }

            .btn-action {
                padding: 6px 14px;
                border-radius: 6px;
                border: none;
                cursor: pointer;
                font-size: 0.8rem;
                font-weight: 600;
                transition: all 0.15s;
            }

            .btn-action:hover {
                transform: translateY(-1px);
                filter: brightness(1.15);
            }

            .btn-keep {
                background: #334155;
                color: #94a3b8;
            }

            .btn-move {
                background: #f59e0b;
                color: #1a1a2e;
            }

            .btn-create {
                background: #3b82f6;
                color: white;
            }

            .btn-setlist {
                background: #64748b;
                color: white;
            }

            .kept-badge {
                color: #6ee7b7;
                font-weight: 600;
                font-size: 0.85rem;
            }

            .loading-state {
                text-align: center;
                padding: 60px 20px;
                color: #94a3b8;
            }

            .error-message-fixed {
                background: #7f1d1d;
                color: #fecaca;
                padding: 12px 16px;
                border-radius: 8px;
                margin-bottom: 16px;
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <a
                href="tags.html"
                style="
                    display: inline-block;
                    margin-bottom: 20px;
                    color: #3b82f6;
                    text-decoration: none;
                "
            >
                <i class="fas fa-arrow-left"></i> Back to Tags
            </a>

            <header>
                <h1><i class="fas fa-inbox"></i> Bulk Import Tags</h1>
                <p class="subtitle">
                    Paste tags per category and import them into the database
                </p>
            </header>

            <div class="error-message-fixed" id="error-message"></div>

            <!-- Loading State -->
            <div id="loading-state" class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading categories...</p>
            </div>

            <!-- Categories Container -->
            <div id="categories-container"></div>

            <!-- Import Button -->
            <button class="btn-primary" id="import-btn">
                <i class="fas fa-cloud-upload-alt"></i> Import All
            </button>

            <!-- Results Container -->
            <div id="results-container"></div>
        </div>

        <script src="bulk-import-tags.js"></script>
    </body>
</html>
