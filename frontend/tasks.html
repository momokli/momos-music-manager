<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Manager POC - Tasks</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="stylesheet" href="style.css" />
        <style>
            .tasks-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 12px;
                margin-bottom: 20px;
            }
            .filter-bar {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .filter-bar select {
                padding: 8px 14px;
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 6px;
                color: #e2e8f0;
                font-size: 0.9rem;
                cursor: pointer;
            }
            .filter-bar select:focus {
                outline: none;
                border-color: #3b82f6;
            }
            .filter-bar label {
                font-size: 0.9rem;
                color: #94a3b8;
            }
            .table-container {
                background: #1e293b;
                border-radius: 12px;
                border: 1px solid #334155;
                overflow-x: auto;
                margin-bottom: 20px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th {
                text-align: left;
                padding: 14px 16px;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #64748b;
                background: #0f172a;
                border-bottom: 1px solid #334155;
                white-space: nowrap;
            }
            td {
                padding: 12px 16px;
                border-bottom: 1px solid #1e293b;
                font-size: 0.9rem;
                vertical-align: middle;
            }
            tr:last-child td {
                border-bottom: none;
            }
            tr:hover td {
                background: rgba(59, 130, 246, 0.05);
            }
            .task-id {
                font-family: monospace;
                font-size: 0.8rem;
                color: #94a3b8;
                max-width: 100px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                cursor: default;
            }
            .task-type-badge {
                display: inline-block;
                padding: 3px 10px;
                border-radius: 20px;
                font-size: 0.8rem;
                font-weight: 600;
                text-transform: capitalize;
            }
            .task-type-badge.spotify_sync {
                background: rgba(29, 185, 84, 0.15);
                color: #1db954;
                border: 1px solid rgba(29, 185, 84, 0.3);
            }
            .task-type-badge.write_comment {
                background: rgba(139, 92, 246, 0.15);
                color: #a78bfa;
                border: 1px solid rgba(139, 92, 246, 0.3);
            }
            .status-badge {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 4px 12px;
                border-radius: 20px;
                font-size: 0.8rem;
                font-weight: 600;
            }
            .status-badge.pending {
                background: rgba(250, 204, 21, 0.1);
                color: #facc15;
                border: 1px solid rgba(250, 204, 21, 0.3);
            }
            .status-badge.running {
                background: rgba(59, 130, 246, 0.1);
                color: #60a5fa;
                border: 1px solid rgba(59, 130, 246, 0.3);
            }
            .status-badge.running i {
                animation: spin 1s linear infinite;
            }
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            .status-badge.completed {
                background: rgba(16, 185, 129, 0.1);
                color: #6ee7b7;
                border: 1px solid rgba(16, 185, 129, 0.3);
            }
            .status-badge.failed {
                background: rgba(239, 68, 68, 0.1);
                color: #fca5a5;
                border: 1px solid rgba(239, 68, 68, 0.3);
            }
            .status-badge.cancelled {
                background: rgba(100, 116, 139, 0.1);
                color: #94a3b8;
                border: 1px solid rgba(100, 116, 139, 0.3);
            }
            .service-badge {
                display: inline-block;
                padding: 2px 8px;
                border-radius: 4px;
                font-size: 0.75rem;
                font-weight: 600;
                text-transform: uppercase;
            }
            .service-badge.spotify {
                background: rgba(29, 185, 84, 0.15);
                color: #1db954;
            }
            .progress-text {
                color: #94a3b8;
                font-size: 0.85rem;
                max-width: 300px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .created-time {
                color: #64748b;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            .btn-cancel {
                padding: 6px 12px;
                background: transparent;
                border: 1px solid #ef4444;
                color: #ef4444;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.8rem;
                transition: all 0.15s;
            }
            .btn-cancel:hover {
                background: rgba(239, 68, 68, 0.1);
            }
            .btn-cancel:disabled {
                border-color: #475569;
                color: #475569;
                cursor: not-allowed;
                background: transparent;
            }
            .paginator {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 12px;
                padding: 16px;
            }
            .paginator button {
                padding: 8px 16px;
                background: #1e293b;
                border: 1px solid #334155;
                color: #e2e8f0;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.85rem;
                transition: all 0.15s;
            }
            .paginator button:hover:not(:disabled) {
                border-color: #3b82f6;
                color: #60a5fa;
            }
            .paginator button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .paginator span {
                color: #94a3b8;
                font-size: 0.9rem;
            }
            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #64748b;
            }
            .empty-state i {
                font-size: 3rem;
                margin-bottom: 12px;
                color: #334155;
            }
            .loading-overlay {
                text-align: center;
                padding: 40px;
            }
            .hidden {
                display: none !important;
            }
            .logs-popup {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 12px;
                padding: 24px;
                max-width: 600px;
                width: 90%;
                max-height: 80vh;
                z-index: 1000;
                display: none;
            }
            .logs-popup.open {
                display: block;
            }
            .logs-popup h3 {
                margin-bottom: 12px;
                color: #e2e8f0;
                font-size: 1.1rem;
            }
            .logs-popup .logs-content {
                max-height: 50vh;
                overflow-y: auto;
                background: #0f172a;
                border-radius: 8px;
                padding: 12px;
                font-family: monospace;
                font-size: 0.8rem;
                color: #94a3b8;
                line-height: 1.5;
            }
            .logs-popup .logs-content div {
                padding: 2px 0;
                border-bottom: 1px solid #1e293b;
            }
            .logs-popup .logs-content div:last-child {
                border-bottom: none;
            }
            .logs-popup .close-btn {
                margin-top: 12px;
                padding: 8px 16px;
                background: #334155;
                border: none;
                color: #e2e8f0;
                border-radius: 6px;
                cursor: pointer;
                font-size: 0.9rem;
            }
            .overlay-backdrop {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999;
                display: none;
            }
            .overlay-backdrop.open {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <a href="index.html" style="display:inline-block;margin-bottom:20px;color:#3b82f6;text-decoration:none;">
                <i class="fas fa-arrow-left"></i> Back to Services
            </a>
            <header>
                <h1><i class="fas fa-list-check"></i> Tasks</h1>
                <p class="subtitle">Monitor background operations: sync jobs, comment writes, and more</p>
            </header>
            <div class="error-message" id="error-message"></div>
            <div class="tasks-header">
                <div class="filter-bar">
                    <label for="status-filter">Status:</label>
                    <select id="status-filter" onchange="loadTasks()">
                        <option value="">All</option>
                        <option value="running">Running</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="failed">Failed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                    <button onclick="loadTasks()" style="padding:8px 14px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#e2e8f0;cursor:pointer;">
                        <i class="fas fa-rotate"></i> Refresh
                    </button>
                </div>
                <div>
                    <span id="task-count" style="color:#94a3b8;font-size:0.9rem;">0 tasks</span>
                </div>
            </div>
            <div id="loading-state">
                <div class="loading-overlay">
                    <div class="loading-spinner"></div>
                    <p>Loading tasks...</p>
                </div>
            </div>
            <div id="content-area" class="hidden">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Type</th>
                                <th>Status</th>
                                <th>Service</th>
                                <th>Progress</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tasks-tbody"></tbody>
                    </table>
                </div>
                <div class="paginator" id="paginator"></div>
            </div>
            <div id="empty-state" class="hidden">
                <div class="empty-state">
                    <i class="fas fa-circle-check"></i>
                    <p>No tasks found.</p>
                </div>
            </div>
            <div class="overlay-backdrop" id="overlay-backdrop"></div>
            <div class="logs-popup" id="logs-popup">
                <h3><i class="fas fa-list"></i> Task Logs</h3>
                <div class="logs-content" id="logs-content"></div>
                <button class="close-btn" onclick="closeLogs()">Close</button>
            </div>
            <footer>
                <p>Backend API: <code id="api-url">http://localhost:3000/api</code></p>
                <p>Navigate to <a href="index.html" style="color:#3b82f6">Services page</a> to configure services</p>
            </footer>
        </div>
        <script src="tasks.js"></script>
    </body>
</html>
