<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CRUD Prototype — Momo's Music Manager</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <style>
            /* ================================================================
       DESIGN SYSTEM
       ================================================================ */

            :root {
                --bg: #0b0d12;
                --surface: #14181f;
                --surface-hover: #1a1f2a;
                --border: #1e293b;
                --border-strong: #334155;
                --text: #e2e8f0;
                --text-secondary: #cbd5e1;
                --text-muted: #94a3b8;
                --text-subtle: #64748b;
                --accent: #6366f1;
                --accent-hover: #5558e6;
                --accent-bg: rgba(99, 102, 241, 0.1);
                --green: #10b981;
                --green-bg: rgba(16, 185, 129, 0.1);
                --red: #ef4444;
                --red-bg: rgba(239, 68, 68, 0.1);
                --yellow: #f59e0b;
                --yellow-bg: rgba(245, 158, 11, 0.1);
                --purple: #8b5cf6;
                --radius-sm: 4px;
                --radius-md: 6px;
                --radius-lg: 8px;
                --radius-xl: 12px;
                --font-sans: system-ui, -apple-system, sans-serif;
                --font-mono: ui-monospace, "SF Mono", "Cascadia Code", monospace;
                --transition: 0.15s ease;
                --space-1: 4px;
                --space-2: 8px;
                --space-3: 12px;
                --space-4: 16px;
                --space-5: 20px;
                --space-6: 24px;
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: var(--font-sans);
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                padding: var(--space-6);
            }

            /* ─── Layout ─── */

            .app-header {
                display: flex;
                align-items: center;
                gap: var(--space-4);
                margin-bottom: var(--space-6);
                padding-bottom: var(--space-4);
                border-bottom: 1px solid var(--border);
            }
            .app-header h1 {
                font-size: 1.25rem;
                font-weight: 600;
                color: var(--text);
            }
            .app-header h1 i {
                color: var(--accent);
                margin-right: var(--space-2);
            }
            .app-header .subtitle {
                color: var(--text-subtle);
                font-size: 0.8rem;
                margin-left: auto;
            }

            /* ─── Filter Panel ─── */

            .filter-panel {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-xl);
                margin-bottom: var(--space-4);
                overflow: visible;
                transition: all var(--transition);
            }
            .filter-panel.collapsed {
                max-height: 52px;
                overflow: hidden;
            }
            .filter-panel-header {
                display: flex;
                align-items: center;
                gap: var(--space-3);
                padding: var(--space-3) var(--space-4);
                border-bottom: 1px solid var(--border);
            }
            .filter-panel.collapsed .filter-panel-header {
                border-bottom: none;
            }
            .filter-panel-header .search-wrap {
                flex: 1;
                max-width: 400px;
                margin-bottom: 0;
            }
            .filter-panel-toggle {
                background: transparent;
                border: 1px solid var(--border);
                color: var(--text-muted);
                width: 32px;
                height: 32px;
                border-radius: var(--radius-md);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition: all var(--transition);
            }
            .filter-panel-toggle:hover {
                background: var(--accent-bg);
                color: var(--accent);
                border-color: var(--accent);
            }
            .filter-panel-toggle .chevron {
                transition: transform 0.2s ease;
            }
            .filter-panel.collapsed .filter-panel-toggle .chevron {
                transform: rotate(-90deg);
            }
            .filter-panel-body {
                padding: var(--space-3) var(--space-4);
                display: flex;
                flex-direction: column;
                gap: var(--space-3);
                overflow: visible;
            }
            .filter-panel.collapsed .filter-panel-body {
                display: none;
            }
            .filter-row {
                display: flex;
                align-items: center;
                gap: var(--space-3);
                flex-wrap: wrap;
            }
            .filter-row-label {
                font-size: 0.7rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: var(--text-subtle);
                min-width: 32px;
            }
            /* ─── Filter section headers ─── */
            .filter-section-header {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 6px 0 3px 0;
                margin-top: 6px;
                border-top: 1px solid var(--border);
                font-size: 0.62rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--text-subtle);
            }
            .filter-section-header i {
                font-size: 0.55rem;
                opacity: 0.6;
            }

            /* ─── Actions panel ─── */
            .actions-panel {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-xl);
                padding: var(--space-3) var(--space-4);
            }
            .actions-panel-header {
                font-size: 0.65rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--text-subtle);
                margin-bottom: var(--space-3);
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .actions-panel-header i {
                font-size: 0.6rem;
                opacity: 0.6;
            }
            .actions-panel .btn {
                width: 100%;
                justify-content: center;
                margin-bottom: var(--space-2);
            }
            .actions-panel .btn-green {
                background: var(--green);
                border-color: var(--green);
                color: #fff;
            }
            .actions-panel .btn-green:hover {
                opacity: 0.9;
            }
            .actions-panel .action-section {
                margin-bottom: var(--space-3);
                padding-bottom: var(--space-3);
                border-bottom: 1px solid var(--border);
            }

            .filter-group {
                display: flex;
                gap: var(--space-1);
                flex-wrap: wrap;
            }
            .filter-btn {
                padding: 4px 10px;
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                background: transparent;
                color: var(--text-muted);
                font-size: 0.75rem;
                cursor: pointer;
                transition: all var(--transition);
                font-family: var(--font-sans);
            }
            .filter-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .filter-btn.active {
                background: var(--accent-bg);
                border-color: var(--accent);
                color: var(--accent);
            }

            /* ─── Dual Range Slider (BPM) ─── */

            .dual-range-wrap {
                display: flex;
                align-items: center;
                gap: var(--space-2);
                min-width: 200px;
            }
            .dual-range {
                position: relative;
                width: 140px;
                height: 24px;
            }
            .dual-range-track {
                position: absolute;
                top: 50%;
                left: 0;
                right: 0;
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                transform: translateY(-50%);
            }
            .dual-range-fill {
                position: absolute;
                top: 50%;
                height: 4px;
                background: var(--accent);
                border-radius: 2px;
                transform: translateY(-50%);
            }
            .dual-range input[type="range"] {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                -webkit-appearance: none;
                appearance: none;
                background: transparent;
                pointer-events: none;
                margin: 0;
            }
            .dual-range input[type="range"]::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--accent);
                border: 2px solid var(--bg);
                cursor: pointer;
                pointer-events: auto;
            }
            .dual-range-values {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 0.75rem;
                font-family: var(--font-mono);
                color: var(--text-muted);
                min-width: 60px;
            }
            .dual-range-values .sep {
                color: var(--text-subtle);
            }

            /* ─── Key Grid ─── */

            .key-grid-wrap {
                display: flex;
                flex-direction: column;
                gap: var(--space-1);
            }
            .key-grid {
                display: flex;
                gap: 2px;
                flex-wrap: wrap;
                align-items: center;
            }
            .key-btn {
                width: 30px;
                height: 24px;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                background: transparent;
                color: var(--text-muted);
                font-size: 0.65rem;
                font-family: var(--font-mono);
                cursor: pointer;
                transition: all var(--transition);
            }
            .key-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .key-btn.active {
                background: var(--accent-bg);
                border-color: var(--accent);
                color: var(--accent);
            }
            .key-btn.minor.active {
                background: var(--purple);
                border-color: var(--purple);
                color: #fff;
            }
            .key-btn.major.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .key-btn.action {
                width: auto;
                padding: 0 6px;
                font-size: 0.6rem;
            }
            .key-btn.action.active {
                background: var(--accent-bg);
                color: var(--accent);
            }

            /* ─── Tag Filter ─── */

            .tag-chips {
                display: flex;
                gap: 4px;
                flex-wrap: wrap;
            }
            .tag-chip {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 2px 8px;
                border-radius: 12px;
                background: var(--accent-bg);
                color: var(--accent);
                font-size: 0.75rem;
                font-family: var(--font-mono);
            }
            .tag-chip-x {
                cursor: pointer;
                opacity: 0.6;
                font-size: 0.7rem;
            }
            .tag-chip-x:hover {
                opacity: 1;
            }
            .tag-search-wrap {
                position: relative;
            }
            .tag-search-wrap .input-search {
                padding-left: 28px !important;
            }
            .tag-search-wrap > i {
                position: absolute;
                left: 10px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-subtle);
                font-size: 0.75rem;
                pointer-events: none;
            }

            /* ─── Search ─── */

            .search-wrap {
                position: relative;
            }
            .search-wrap i {
                position: absolute;
                left: 10px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-subtle);
                font-size: 0.75rem;
                pointer-events: none;
            }
            .input-text {
                padding: 6px 10px;
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                background: var(--bg);
                color: var(--text);
                font-size: 0.8rem;
                font-family: var(--font-sans);
                outline: none;
                transition: border-color var(--transition);
                width: 100%;
            }
            .input-text:focus {
                border-color: var(--accent);
            }
            .input-search {
                padding-left: 28px !important;
                width: 100%;
            }

            /* ─── Stats Row ─── */

            .stats-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: var(--space-2) 0;
            }
            .stats-group {
                display: flex;
                align-items: center;
                gap: var(--space-2);
                flex-wrap: wrap;
            }
            .stats-group strong {
                font-size: 0.9rem;
            }

            /* ─── Buttons ─── */

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 6px 12px;
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                background: transparent;
                color: var(--text);
                font-size: 0.8rem;
                cursor: pointer;
                transition: all var(--transition);
                font-family: var(--font-sans);
                white-space: nowrap;
            }
            .btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .btn-primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #fff;
            }
            .btn-primary:hover {
                background: var(--accent-hover);
            }
            .btn-sm {
                padding: 3px 8px;
                font-size: 0.75rem;
            }
            .btn-icon {
                padding: 4px 6px;
                min-width: 28px;
                justify-content: center;
            }

            /* ─── Page Size Selector ─── */

            .page-size-select {
                padding: 2px 6px;
                border: 1px solid var(--border);
                border-radius: 4px;
                background: var(--surface);
                color: var(--text);
                font-size: 0.75rem;
                font-family: var(--font-mono);
                margin-left: 8px;
                cursor: pointer;
            }
            .page-size-select:hover {
                border-color: var(--accent);
            }

            /* ─── Column Config Trigger ─── */

            .col-config-trigger {
                padding: 2px 8px;
                border: 1px solid var(--border);
                border-radius: 4px;
                background: transparent;
                color: var(--text-muted);
                font-size: 0.75rem;
                cursor: pointer;
                margin-left: 8px;
            }
            .col-config-trigger:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            /* ─── Table ─── */

            .table-wrap {
                overflow-x: auto;
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                background: var(--surface);
            }
            .data-table {
                width: auto;
                border-collapse: collapse;
                table-layout: fixed;
            }
            .data-table th {
                position: relative;
                padding: 8px 10px;
                font-size: 0.7rem;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.04em;
                color: var(--text-subtle);
                text-align: left;
                border-bottom: 1px solid var(--border);
                background: var(--surface);
                white-space: nowrap;
                user-select: none;
            }
            .data-table th.sortable {
                cursor: pointer;
                user-select: none;
            }
            body.layout-mode .data-table th {
                cursor: grab;
            }
            body.layout-mode .data-table th:active {
                cursor: grabbing;
            }
            .data-table th.sortable:hover {
                background: var(--surface-hover);
            }
            .data-table th.sortable i {
                opacity: 0.3;
                margin-left: 4px;
                font-size: 0.7rem;
            }
            .data-table th.sort-asc i.fa-sort-up,
            .data-table th.sort-desc i.fa-sort-down {
                opacity: 1;
            }
            .data-table th.sort-asc i.fa-sort,
            .data-table th.sort-desc i.fa-sort,
            .data-table th:not(.sort-asc):not(.sort-desc) i.fa-sort-up,
            .data-table th:not(.sort-asc):not(.sort-desc) i.fa-sort-down {
                display: none;
            }
            .data-table th:not(.sort-asc):not(.sort-desc) i.fa-sort {
                display: inline;
            }
            .data-table td {
                padding: 6px 10px;
                font-size: 0.8rem;
                border-bottom: 1px solid var(--border);
                color: var(--text-secondary);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .data-table tr:last-child td {
                border-bottom: none;
            }
            .data-table tr:hover td {
                background: var(--surface-hover);
            }

            /* ─── Drag Reorder ─── */

            th.dragging {
                opacity: 0.5;
                border: 1px dashed var(--accent);
            }
            th.drop-target {
                border-left: 2px solid var(--accent);
            }

            /* ─── Column Resize Handles ─── */

            .col-resize-handle {
                display: none;
                position: absolute;
                right: 0;
                top: 4px;
                bottom: 4px;
                width: 6px;
                cursor: col-resize;
                z-index: 10;
                user-select: none;
                background: transparent;
                border-radius: 3px;
                transition:
                    background 0.15s ease,
                    width 0.15s ease;
            }
            body.layout-mode .col-resize-handle {
                display: block;
            }
            .col-resize-handle:hover,
            .col-resize-handle.resizing {
                background: var(--accent);
                width: 8px;
                right: -1px;
                opacity: 0.7;
            }

            /* ─── Pagination ─── */

            .pagination {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: var(--space-3);
                padding: var(--space-3) 0;
            }
            .pagination-btn {
                padding: 4px 10px;
                border: 1px solid var(--border);
                border-radius: var(--radius-md);
                background: transparent;
                color: var(--text-muted);
                cursor: pointer;
                transition: all var(--transition);
                font-size: 0.8rem;
            }
            .pagination-btn:hover:not(:disabled) {
                border-color: var(--accent);
                color: var(--accent);
            }
            .pagination-btn:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }
            .pagination-info {
                font-size: 0.8rem;
                color: var(--text-muted);
                font-family: var(--font-mono);
            }

            /* ─── Modal ─── */

            .modal {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.6);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease;
            }
            .modal.open {
                opacity: 1;
                pointer-events: auto;
            }
            .modal-content {
                background: var(--surface);
                border: 1px solid var(--border-strong);
                border-radius: var(--radius-xl);
                min-width: 400px;
                max-width: 90vw;
                max-height: 80vh;
                overflow: hidden;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            }
            .modal-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: var(--space-4) var(--space-5);
                border-bottom: 1px solid var(--border);
            }
            .modal-header h3 {
                font-size: 0.9rem;
                font-weight: 600;
            }
            .close-btn {
                background: none;
                border: none;
                color: var(--text-muted);
                font-size: 1.2rem;
                cursor: pointer;
                padding: 4px;
            }
            .close-btn:hover {
                color: var(--text);
            }
            .modal-actions {
                display: flex;
                align-items: center;
                gap: var(--space-2);
                padding: var(--space-4) var(--space-5);
                border-top: 1px solid var(--border);
            }

            /* ─── Column Config Modal Items ─── */

            .col-config-item {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 0;
                cursor: grab;
            }
            .col-config-item:active {
                cursor: grabbing;
            }
            .col-config-item.dragging {
                opacity: 0.4;
            }
            .col-config-drag-handle {
                cursor: grab;
                color: var(--text-muted);
                font-size: 0.85rem;
                padding: 0 4px;
            }
            .col-config-checkbox {
                margin: 0;
            }
            .col-config-label {
                flex: 1;
                font-size: 0.85rem;
            }
            .col-config-width {
                width: 60px;
                padding: 2px 4px;
                border: 1px solid var(--border);
                border-radius: 4px;
                background: var(--bg);
                color: var(--text);
                font-size: 0.75rem;
                text-align: center;
                font-family: var(--font-mono);
            }
            .col-config-reset {
                width: 100%;
            }

            .filter-disabled {
                pointer-events: none !important;
                opacity: 0.4 !important;
            }

            /* ─── Comment diff ─── */
            .diff-box {
                font-family: var(--font-mono);
                font-size: 0.65rem;
                line-height: 1.4;
            }
            .diff-line-old {
                color: var(--red);
                text-decoration: line-through;
                opacity: 0.6;
            }
            .diff-line-new {
                color: var(--green);
            }

            /* ─── Helpers ─── */

            .text-muted {
                color: var(--text-muted);
            }
            .text-subtle {
                color: var(--text-subtle);
            }
            .font-mono {
                font-family: var(--font-mono);
            }
            .text-xs {
                font-size: 0.7rem;
            }
            .text-sm {
                font-size: 0.75rem;
            }
            .text-center {
                text-align: center;
            }
            .flex {
                display: flex;
            }
            .items-center {
                align-items: center;
            }
            .gap-1 {
                gap: 4px;
            }
            .gap-2 {
                gap: 8px;
            }
            .ml-auto {
                margin-left: auto;
            }
            .w-full {
                width: 100%;
            }
            .mt-4 {
                margin-top: 16px;
            }

            /* ─── Empty state ─── */

            .empty-state {
                padding: 48px 16px;
                text-align: center;
            }
            .empty-state .icon {
                font-size: 2rem;
                color: var(--text-subtle);
                margin-bottom: 12px;
            }
            .empty-state h3 {
                font-size: 1rem;
                color: var(--text-muted);
                margin-bottom: 8px;
            }
            .empty-state p {
                font-size: 0.85rem;
                color: var(--text-subtle);
            }

            /* ─── Badges ─── */

            .badge {
                display: inline-flex;
                align-items: center;
                gap: 3px;
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 0.7rem;
                font-family: var(--font-mono);
            }
            .badge-key {
                background: var(--accent-bg);
                color: var(--accent);
            }
            .service-badge {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                padding: 2px 8px;
                border-radius: 4px;

            function random(arr) {
                return arr[Math.floor(Math.random() * arr.length)];
            }
            function randBetween(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            const MINOR_KEYS = [];
            const MAJOR_KEYS = [];
            for (let i = 1; i <= 12; i++) {
                MINOR_KEYS.push(i + "m");
                MAJOR_KEYS.push(i + "d");
            }

            const ALL_KEYS = [...MINOR_KEYS, ...MAJOR_KEYS];

            const TAG_NAMES = [
                "build",
                "peak",
                "start",
                "release",
                "sustain",
                "end",
                "warmup",
                "intro",
                "breakdown",
                "drop",
                "groove",
                "dark",
                "melodic",
                "driving",
                "deep",
                "tech",
                "vocal",
                "chill",
                "energetic",
                "minimal",
            ];

            const GENRES = [
                "House",

                "Electro",
                "Downtempo",
                "Trance",
                "Progressive",
                "Dub",
                "Minimal",
                "Acid",
            ];

            function generateMockFiles(count) {
                const files = [];
                for (let i = 1; i <= count; i++) {
                    const title =
                        TITLES[i % TITLES.length] +
                        (i > TITLES.length
                            ? ` (${Math.floor(i / TITLES.length) + 1})`
                            : "");
                    files.push({
                        id: i,
                        title,
                        artist: random(ARTISTS),
                        bpm: randBetween(70, 180),
                        key: random(ALL_KEYS),
                        isrc:
                            Math.random() > 0.2
                                ? `GBCEL${String(randBetween(1000000, 9999999)).padStart(7, "0")}`
                                : null,
                        album: Math.random() > 0.3 ? random(ALBUMS) : null,
                        playCount: randBetween(0, 200),
                        duration: randBetween(120, 480),
                        createdAt: Date.now() - randBetween(0, 365) * 86400000,
                        lastModified: Date.now() - randBetween(0, 180) * 86400000,
                        lastPlayed:
                            Math.random() > 0.3
                                ? Date.now() - randBetween(0, 90) * 86400000
                                : null,
                        // Each file is linked to 1-3 services
                        services: (() => {
                            const numServices = randBetween(1, 3);
                            const shuffledSvcs = [...SERVICES]
                                .sort(() => Math.random() - 0.5)
                                .slice(0, numServices);
                            return shuffledSvcs;
                        })(),
                        fileType: (() => {
                            const r = Math.random();
                            if (r < 0.4) return "mp3";
                            if (r < 0.7) return "stem.m4a";
                            if (r < 0.9) return "flac";
                            return "wav";
                        })(),
                        genre: random(GENRES),
                        tagCount: randBetween(0, 8),
                        tags: Array.from({ length: randBetween(0, 4) }, () =>
                            random(TAG_NAMES),
                        ),
                        // Comment diff data
                        comment: (() => {
                            const needsUpdate = Math.random() > 0.6;
                            const phase = [
                                "start",
                                "build",
                                "peak",
                                "release",
                                "sustain",
                            ][randBetween(0, 4)];
                            const pc = {
                                start: "S",
                                build: "B",
                                peak: "P",
                                release: "R",
                                sustain: "S",
                            }[phase];
                            return `[${pc}MV] ${phase} tech house`;
                        })(),
                        commentTarget: `[${["S", "B", "P", "R", "S"][randBetween(0, 4)]}MV] ${["start", "build", "peak", "release", "sustain"][randBetween(0, 4)]} tech house`,
                        commentNeedsUpdate: Math.random() > 0.6,
                    });
                }
                return files;

            // Generate 53 mock tracks

                "Lane 8",
                "Oliver Koletzki",
            ];

            const TRACK_SERVICES = ["spotify", "soundcloud", "youtube", "deemix"];

            const FILE_TYPES = ["stem.m4a", "flac", "mp3", "wav"];

            function generateMockTracks(count) {
                const tracks = [];
                const usedArtistTrack = new Set();

                for (let i = 1; i <= count; i++) {
                    let artist, title;
                    // Ensure unique artist + title combos
                    do {
                        artist = random(TRACK_ARTISTS);
                        title = random(TRACK_TITLES);
                    } while (usedArtistTrack.has(artist + "||" + title));
                    usedArtistTrack.add(artist + "||" + title);

                    // Each track is on 1-2 services
                    const numServices = randBetween(1, 2);
                    const shuffledServices = [...TRACK_SERVICES]
                        .sort(() => Math.random() - 0.5)
                        .slice(0, numServices);

                    // Each track has 1-3 local file versions
                    const numFiles = randBetween(1, 3);
                    const fileVersions = [...FILE_TYPES]
                        .sort(() => Math.random() - 0.5)
                        .slice(0, numFiles);

                    // Generate the local file paths
                    const localFiles = fileVersions.map((ft) => {
                        const cleanName = title.replace(/[^a-zA-Z0-9]/g, "");
                        return `~/Music/${ft === "stem.m4a" ? "stems" : ft === "flac" ? "flacs" : "tracks"}/${artist} - ${cleanName}.${ft}`;
                    });

                    tracks.push({
                        id: i,
                        title: title,
                        artist: artist,
                        services: shuffledServices,
                        localFiles: localFiles,
                        album: random(ALBUMS),
                        isrc: `GBCEL${String(randBetween(1000000, 9999999)).padStart(7, "0")}`,
                        duration: randBetween(120, 480),
                        importedAt: Date.now() - randBetween(0, 365) * 86400000,
                        // For display
                        fileTypesBadge: fileVersions,
                        servicesBadge: shuffledServices,
                    });
                }
                return tracks;
            }

            let ALL_TRACKS = generateMockTracks(30);

            // ================================================================

            const FILES_COLUMNS = [

            const TRACKS_COLUMNS = [

            // Column config from localStorage
            function getColumnModel(view) {
                return view === "tracks" ? TRACKS_COLUMNS : FILES_COLUMNS;
            }

            function loadColumnConfig(view) {
                const model = getColumnModel(view);
                const storageKey = "columnConfig_" + view;
                const saved = localStorage.getItem(storageKey);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Merge with model to handle added/removed columns
                        return model.map((col) => {
                            const existing = parsed.find((p) => p.id === col.id);
                            return existing
                                ? {
                                      id: col.id,
                                      visible: existing.visible,
                                      width: existing.width,
                                  }
                                : { id: col.id, visible: true, width: col.defaultWidth };
                        });
                    } catch (e) {}
                }
                return model.map((col) => ({
                    id: col.id,
                    visible: true,
                    width: col.defaultWidth,
                }));
            }

            function saveColumnConfig(config) {
                const storageKey = "columnConfig_" + state.view;
                localStorage.setItem(storageKey, JSON.stringify(config));
            }

            // Full state
            const state = {
                // View
                view: localStorage.getItem("prototype_view") || "files",
                // Pagination
                page: 0,
                pageSize: parseInt(localStorage.getItem("crudPageSize")) || 25,
                // Search
                search: "",
                // Filters
                selectedServices: [],
                bpmMin: 0,
                bpmMax: 200,
                selectedKeys: [],
                // Date range filters (condition + unit)
                createdFilter: {
                    enabled: false,
                    condition: "last",
                    value: 30,
                    unit: "days",
                },
                modifiedFilter: {
                    enabled: false,
                    condition: "last",
                    value: 30,
                    unit: "days",
                },
                playedFilter: {
                    enabled: false,
                    condition: "last",
                    value: 14,
                    unit: "days",
                },
                // Comment status filter
                commentStatus: "all", // "all", "needs_update", "uptodate"
                // File type filter
                fileType: "all",
                // Additional filters
                playsMin: 0,
                playsMax: 200,
                selectedGenres: [],
                selectedTags: [],
                // Layout mode
                layoutMode: false,
                // Sort
                sort: "",
                order: "asc",
                // Column config
                columnConfig: loadColumnConfig(
                    localStorage.getItem("prototype_view") || "files",
                ),
                // Data
                data: [],
                total: 0,
            };

            // ================================================================
            // 3. DATA LAYER (PURE FUNCTIONS)
            // ================================================================

            function getFilteredData(state) {
                const isTracks = state.view === "tracks";
                let data = [...(isTracks ? ALL_TRACKS : ALL_FILES)];

                // Full-text search across string fields
                if (state.search) {
                    const q = state.search.toLowerCase();
                    data = data.filter(
                        (f) =>
                            f.title.toLowerCase().includes(q) ||
                            f.artist.toLowerCase().includes(q) ||
                            (f.album && f.album.toLowerCase().includes(q)) ||
                            (f.isrc && f.isrc.toLowerCase().includes(q)),
                    );
                }

                // Service filter (multi-select: show files matching ANY selected service)
                if (state.selectedServices.length > 0) {
                    data = data.filter(
                        (f) =>
                            f.services &&
                            f.services.some((s) => state.selectedServices.includes(s)),
                    );
                }

                // ─── File-specific filters (skip for tracks) ───
                if (!isTracks) {
                    // BPM range
                    data = data.filter(
                        (f) => f.bpm >= state.bpmMin && f.bpm <= state.bpmMax,
                    );

                    // Key filter
                    if (state.selectedKeys.length > 0) {
                        data = data.filter((f) => state.selectedKeys.includes(f.key));
                    }

                    // Plays range
                    data = data.filter(
                        (f) =>
                            f.playCount >= state.playsMin &&
                            f.playCount <= state.playsMax,
                    );

                    // File type filter
                    if (state.fileType !== "all") {
                        data = data.filter((f) => f.fileType === state.fileType);
                    }

                    // Genre filter
                    if (state.selectedGenres.length > 0) {
                        data = data.filter((f) => state.selectedGenres.includes(f.genre));
                    }

                    // Tag filter
                    if (state.selectedTags.length > 0) {
                        data = data.filter(
                            (f) =>
                                f.tags &&
                                f.tags.some((t) => state.selectedTags.includes(t)),
                        );
                    }

                    // Comment status filter
                    if (state.commentStatus === "needs_update") {
                        data = data.filter((f) => f.commentNeedsUpdate);
                    } else if (state.commentStatus === "uptodate") {
                        data = data.filter((f) => !f.commentNeedsUpdate);
                    }

                    // Date filters with condition + unit
                    function applyDateFilter(data, filter, field) {
                        if (!filter.enabled) return data;
                        const multiplier =
                            filter.unit === "weeks"
                                ? 7
                                : filter.unit === "months"
                                  ? 30
                                  : 1;
                        const daysMs = filter.value * multiplier * 86400000;
                        const now = Date.now();
                        return data.filter((f) => {
                            const val = f[field];
                            if (!val) return filter.condition === "more";
                            if (filter.condition === "last") return val >= now - daysMs;
                            return val < now - daysMs;
                        });
                    }
                    data = applyDateFilter(data, state.createdFilter, "createdAt");
                    data = applyDateFilter(data, state.modifiedFilter, "lastModified");
                    data = applyDateFilter(data, state.playedFilter, "lastPlayed");
                } else {
                    // Tracks import date filter
                    if (state.tracksImportFilter && state.tracksImportFilter.enabled) {
                        const multiplier =
                            state.tracksImportFilter.unit === "weeks"
                                ? 7
                                : state.tracksImportFilter.unit === "months"
                                  ? 30
                                  : 1;
                        const daysMs =
                            state.tracksImportFilter.value * multiplier * 86400000;
                        const now = Date.now();
                        const cutoff = now - daysMs;
                        data = data.filter((t) => {
                            if (!t.importedAt)
                                return state.tracksImportFilter.condition === "more";
                            if (state.tracksImportFilter.condition === "last")
                                return t.importedAt >= cutoff;
                            return t.importedAt < cutoff;
                        });
                    }
                }

                return data;
            }

            function getSortedData(data, state) {
                if (!state.sort) return data;
                return [...data].sort((a, b) => {
                    let cmp = 0;
                    const aVal = a[state.sort];
                    const bVal = b[state.sort];
                    if (typeof aVal === "string")
                        cmp = (aVal || "").localeCompare(bVal || "");
                    else if (typeof aVal === "number") cmp = (aVal || 0) - (bVal || 0);
                    else if (aVal instanceof Date || typeof aVal === "number")
                        cmp = (aVal || 0) - (bVal || 0);
                    return state.order === "desc" ? -cmp : cmp;
                });
            }

            function getPaginatedData(data, state) {
                const start = state.page * state.pageSize;
                return data.slice(start, start + state.pageSize);
            }

            // ================================================================
            // 4. RENDER FUNCTIONS
            // ================================================================

            function formatDuration(seconds) {
                if (!seconds || seconds <= 0) return "—";
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${String(s).padStart(2, "0")}`;
            }

            function formatTimestamp(ts) {
                if (!ts) return '<span class="text-muted">—</span>';
                const d = new Date(ts);
                return `<span class="font-mono text-xs">${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>`;
            }

            function renderKeyBadge(key) {
                if (!key) return "";
                return `<span class="badge badge-key">${key}</span>`;
            }

            function renderServiceBadge(service) {
                const icons = {
                    spotify: "fab fa-spotify",
                    soundcloud: "fab fa-soundcloud",
                    youtube: "fab fa-youtube",
                };
                return `<span class="service-badge ${service}"><i class="${icons[service] || "fas fa-music"}"></i> ${service.charAt(0).toUpperCase() + service.slice(1)}</span>`;
            }

            // Column renderer functions
            const CELL_RENDERERS = {
                title: (f) => `<strong>${f.title}</strong>`,
                artist: (f) => f.artist,
                bpm: (f) => `<span class="font-mono">${f.bpm}</span>`,
                key: (f) => renderKeyBadge(f.key),
                album: (f) => f.album || '<span class="text-muted">—</span>',
                genre: (f) => f.genre || '<span class="text-muted">—</span>',
                services: (f) =>
                    f.services
                        .map((s) => {
                            const icons = {
                                spotify: "fab fa-spotify",
                                soundcloud: "fab fa-soundcloud",
                                youtube: "fab fa-youtube",
                                deemix: "fas fa-download",
                            };
                            const colors = {
                                spotify: "#1db954",
                                soundcloud: "#ff7700",
                                youtube: "#ff0000",
                                deemix: "var(--accent)",
                            };
                            return `<span class="service-badge" style="background:${colors[s]}15;color:${colors[s]};border:1px solid ${colors[s]}30;margin-right:2px" title="${s}"><i class="${icons[s] || "fas fa-music"}"></i></span>`;
                        })
                        .join("") || '<span class="text-muted">\u2014</span>',
                duration: (f) =>
                    `<span class="font-mono text-xs">${formatDuration(f.duration)}</span>`,
                plays: (f) => `<span class="font-mono text-xs">${f.playCount}</span>`,
                tagCount: (f) => `<span class="font-mono text-xs">${f.tagCount}</span>`,
                fileType: (f) => {
                    const colors = {
                        mp3: "var(--accent)",
                        flac: "var(--purple)",
                        "stem.m4a": "var(--green)",
                        wav: "var(--yellow)",
                    };
                    const color = colors[f.fileType] || "var(--text-muted)";
                    return `<span class="badge" style="background:${color}15;color:${color};border:1px solid ${color}30">${f.fileType}</span>`;
                },
                isrc: (f) =>
                    f.isrc
                        ? `<code class="font-mono text-xs">${f.isrc}</code>`

                created: (f) => formatTimestamp(f.createdAt),
                lastModified: (f) => formatTimestamp(f.lastModified),
                lastPlayed: (f) => formatTimestamp(f.lastPlayed),
