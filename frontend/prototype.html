                    }
                    return `<div class="diff-box" style="font-size:0.7rem;line-height:1.3">
    <div class="diff-line-old" style="color:var(--red);text-decoration:line-through;opacity:0.7">${f.comment || ""}</div>
    <div class="diff-line-new" style="color:var(--green)">${f.commentTarget || ""}</div>
</div>`;
                },
                actions: (f) =>
                    `<button class="btn btn-sm btn-icon" title="View"><i class="fas fa-eye"></i></button> <button class="btn btn-sm btn-icon" title="Edit"><i class="fas fa-pencil-alt"></i></button>`,
            };

            // ─── TRACKS column renderer functions ───
            const TRACKS_CELL_RENDERERS = {
                title: (t) => `<strong>${t.title}</strong>`,
                artist: (t) => t.artist,
                services: (t) =>
                    t.services
                        .map((s) => {
                            const icons = {
                                spotify: "fab fa-spotify",
                                soundcloud: "fab fa-soundcloud",
                                youtube: "fab fa-youtube",
                                deemix: "fas fa-download",
                            };
                            const colors = {
                                spotify: "#1db954",
                                soundcloud: "#ff7700",
                                youtube: "#ff0000",
                                deemix: "var(--accent)",
                            };
                            return `<span class="service-badge" style="background:${colors[s]}15;color:${colors[s]};border:1px solid ${colors[s]}30;margin-right:4px"><i class="${icons[s] || "fas fa-music"}"></i></span>`;
                        })
                        .join(""),
                localFiles: (t) =>
                    t.localFiles
                        .map((fp) => {
                            const ext = fp.split(".").pop();
                            const colors = {
                                mp3: "var(--accent)",
                                flac: "var(--purple)",
                                "stem.m4a": "var(--green)",
                                wav: "var(--yellow)",
                                m4a: "var(--green)",
                            };
                            const color = colors[ext] || "var(--text-muted)";
                            const label = ext === "stem.m4a" ? "stem" : ext;
                            const shortPath = fp
                                .replace("~/Music/", "")
                                .replace(/^[^/]+\//, "");
                            return `<span class="badge" style="background:${color}15;color:${color};border:1px solid ${color}30;margin:1px 2px" title="${fp}">${label}</span>`;
                        })
                        .join(" ") || '<span class="text-muted">—</span>',
                album: (t) => t.album || '<span class="text-muted">—</span>',
                duration: (t) =>
                    `<span class="font-mono text-xs">${formatDuration(t.duration)}</span>`,
                isrc: (t) => `<code class="font-mono text-xs">${t.isrc}</code>`,
                imported: (t) => formatTimestamp(t.importedAt),
            };

            function renderTable(state) {
                const filtered = getFilteredData(state);
                const sorted = getSortedData(filtered, state);
                const total = sorted.length;
                const paged = getPaginatedData(sorted, state);
                const totalPages = Math.ceil(total / state.pageSize) || 1;
                const config = state.columnConfig;
                const columns = state.view === "tracks" ? TRACKS_COLUMNS : FILES_COLUMNS;
                const cellRenderers =
                    state.view === "tracks" ? TRACKS_CELL_RENDERERS : CELL_RENDERERS;

                // Build headers
                const headersHtml = config
                    .filter((c) => c.visible)
                    .map((c) => {
                        const model = columns.find((m) => m.id === c.id);
                        if (!model) return "";
                        let th;
                        if (model.sortable) {
                            let icon = "fa-sort";
                            let cls = "sortable";
                            if (state.sort === model.sortKey) {
                                cls += state.order === "asc" ? " sort-asc" : " sort-desc";
                                icon =
                                    state.order === "asc" ? "fa-sort-up" : "fa-sort-down";
                            }
                            th = `<th class="${cls}" data-sort="${model.sortKey}" style="width:${c.width}px;min-width:30px;max-width:${c.width}px">${model.label} <i class="fas ${icon}"></i><div class="col-resize-handle"></div></th>`;
                        } else {
                            th = `<th style="width:${c.width}px;min-width:30px;max-width:${c.width}px">${model.label}<div class="col-resize-handle"></div></th>`;
                        }
                        return th;
                    })
                    .join("");

                // Build rows
                const rowsHtml =
                    paged.length === 0
                        ? `<tr><td colspan="${config.filter((c) => c.visible).length}" class="empty-state">
                   <div class="empty-state">
                     <div class="icon"><i class="fas fa-search"></i></div>
                     <h3>No results match your filters</h3>
                     <p>Try adjusting your search or filter criteria.</p>
                   </div>
                 </td></tr>`
                        : paged
                              .map((f) => {
                                  const cellsHtml = config
                                      .filter((c) => c.visible)
                                      .map((c) => {
                                          const renderer = cellRenderers[c.id];
                                          const content = renderer ? renderer(f) : "";
                                          const model = columns.find(
                                              (m) => m.id === c.id,
                                          );
                                          return `<td style="width:${c.width}px;min-width:30px;max-width:${c.width}px">${content}</td>`;
                                      })
                                      .join("");
                                  return `<tr>${cellsHtml}</tr>`;
                              })
                              .join("");

                // Stats row
                const statsHtml = `<div class="stats-row">
              <div class="stats-group">
                <button class="btn btn-sm btn-icon" id="refresh-btn" title="Refresh"><i class="fa-solid fa-rotate"></i></button>
                <strong>${total.toLocaleString()}</strong> ${state.view === "tracks" ? "tracks" : "files"}
                <select class="page-size-select" id="page-size-select">
                  ${[10, 25, 50, 100].map((s) => `<option value="${s}"${s === state.pageSize ? " selected" : ""}>${s} per page</option>`).join("")}
                </select>
                ${state.layoutMode ? '<button class="btn btn-sm btn-primary" id="layout-mode-btn" style="margin-left:8px"><i class="fas fa-check"></i> Done</button>' : '<button class="btn btn-sm" id="layout-mode-btn" style="margin-left:8px"><i class="fas fa-arrows-alt"></i> Modify Column Layout</button>'}
                <button class="col-config-trigger" id="col-config-btn" style="margin-left:8px"><i class="fas fa-table-cells"></i> Columns</button>
              </div>
            </div>`;

                // Pagination
                const paginationHtml = `<div class="pagination">
              <button class="pagination-btn" id="page-prev" ${state.page === 0 ? "disabled" : ""}><i class="fas fa-chevron-left"></i></button>
              <span class="pagination-info">Page ${state.page + 1} of ${totalPages}</span>
              <button class="pagination-btn" id="page-next" ${state.page >= totalPages - 1 ? "disabled" : ""}><i class="fas fa-chevron-right"></i></button>
            </div>`;

                const tableHtml = `<div class="table-wrap"><table class="data-table">
              <thead><tr>${headersHtml}</tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table></div>`;

                return statsHtml + tableHtml + paginationHtml;
            }

            // ================================================================
            // 5. EVENT WIRING
            // ================================================================

            // ─── Genre chip renderer (top-level, called from render()) ───
            function renderGenreChips() {
                const el = document.getElementById("genre-chips");
                if (!el) return;
                el.innerHTML = state.selectedGenres
                    .map(
                        (g) =>
                            `<span class="tag-chip">${g} <span class="tag-chip-x" data-genre="${g}">&times;</span></span>`,
                    )
                    .join("");
            }

            // ─── Tag chip renderer (top-level, called from render()) ───
            function renderTagChips() {
                const el = document.getElementById("tag-chips");
                if (!el) return;
                el.innerHTML = state.selectedTags
                    .map(
                        (t) =>
                            `<span class="tag-chip">${t} <span class="tag-chip-x" data-tag="${t}">&times;</span></span>`,
                    )
                    .join("");
            }

            function render() {
                document.getElementById("content").innerHTML = renderTable(state);
                wireContentEvents();
                renderGenreChips();
                renderTagChips();
            }

            function wireContentEvents() {
                // Refresh
                const refreshBtn = document.getElementById("refresh-btn");
                if (refreshBtn) refreshBtn.onclick = () => render();

                // Pagination
                const prevBtn = document.getElementById("page-prev");
                if (prevBtn)
                    prevBtn.onclick = () => {
                        if (state.page > 0) {
                            state.page--;
                            render();
                        }
                    };
                const nextBtn = document.getElementById("page-next");
                if (nextBtn)
                    nextBtn.onclick = () => {
                        state.page++;
                        render();
                    };

                // Page size
                const pageSizeSel = document.getElementById("page-size-select");
                if (pageSizeSel) {
                    pageSizeSel.onchange = () => {
                        const val = parseInt(pageSizeSel.value, 10);
                        localStorage.setItem("crudPageSize", String(val));
                        state.pageSize = val;
                        state.page = 0;
                        render();
                    };
                }

                // ─── Layout mode toggle ───
                const layoutBtn = document.getElementById("layout-mode-btn");
                if (layoutBtn) {
                    layoutBtn.onclick = () => {
                        state.layoutMode = !state.layoutMode;
                        render();
                    };
                }

                // ─── Visual indicator for layout mode ───
                const thead = document.querySelector("thead");
                if (thead) {
                    if (state.layoutMode) {
                        document.body.classList.add("layout-mode");
                        thead.style.outline = "2px solid var(--accent)";
                        thead.style.outlineOffset = "-1px";
                        thead.style.borderRadius = "4px";
                    } else {
                        document.body.classList.remove("layout-mode");
                        thead.style.outline = "none";
                    }
                }

                // ─── Sortable headers (only when NOT in layout mode) ───
                if (!state.layoutMode) {
                    const table = document.querySelector(".data-table");
                    if (table) {
                        table.querySelectorAll("th.sortable[data-sort]").forEach((th) => {
                            th.addEventListener("click", () => {
                                const col = th.dataset.sort;
                                if (state.sort === col) {
                                    if (state.order === "asc") {
                                        state.order = "desc";
                                    } else {
                                        state.sort = "";
                                        state.order = "asc";
                                    }
                                } else {
                                    state.sort = col;
                                    state.order = "asc";
                                }
                                state.page = 0;
                                render();
                            });
                        });
                    }
                }

                // Layout mode features (resize + reorder)
                if (state.layoutMode) {
                    wireResize();
                    wireDragReorder();
                }

                // Column config button
                const colConfigBtn = document.getElementById("col-config-btn");
                if (colConfigBtn) colConfigBtn.onclick = () => openColumnConfig();

                // ─── Actions panel buttons ───
                document
                    .getElementById("actions-refresh")
                    ?.addEventListener("click", function () {
                        this.innerHTML =
                            '<i class="fas fa-spinner fa-spin"></i> Refreshing…';
                        setTimeout(() => {
                            render();
                            showToast("Data refreshed", "success");
                        }, 300);
                    });
                document
                    .getElementById("actions-write-comments")
                    ?.addEventListener("click", function () {
                        const total = state.total || 0;
                        if (total === 0) {
                            showToast("No files to process", "error");
                            return;
                        }
                        this.disabled = true;
                        this.innerHTML =
                            '<i class="fas fa-spinner fa-spin"></i> Writing…';
                        setTimeout(() => {
                            this.disabled = false;
                            this.innerHTML =
                                '<i class="fas fa-check"></i> Write Comments';
                            showToast(
                                "Comments written to " + total + " files",
                                "success",
                            );
                        }, 1000);
                    });
            }

            // ─── Toast notification helper ───
            function showToast(message, type) {
                const existing = document.querySelector(".toast");
                if (existing) existing.remove();
                const toast = document.createElement("div");
                toast.className = "toast";
                toast.style.cssText =
                    "position:fixed;bottom:24px;right:24px;padding:10px 20px;border-radius:8px;font-size:0.8rem;z-index:9999;transition:opacity 0.3s;max-width:400px;word-break:break-word;box-shadow:0 4px 20px rgba(0,0,0,0.4)";
                toast.style.background = type === "error" ? "var(--red)" : "var(--green)";
                toast.style.color = "#fff";
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = "0";
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            }

            // ─── Resize ───

            function wireResize() {
                const handles = document.querySelectorAll(".col-resize-handle");
                let activeHandle = null;
                let activeTh = null;
                let startX = 0;
                let startWidth = 0;

                handles.forEach((handle) => {
                    handle.addEventListener("mousedown", (e) => {
                        if (!state.layoutMode) return;
                        e.preventDefault();
                        e.stopPropagation();
                        activeHandle = handle;
                        activeTh = handle.parentElement;
                        startX = e.clientX;
                        startWidth = activeTh.offsetWidth;
                        handle.classList.add("resizing");
                        document.body.style.cursor = "col-resize";
                        document.body.style.userSelect = "none";
                    });
                });

                document.addEventListener("mousemove", (e) => {
                    if (!activeTh) return;
                    const diff = e.clientX - startX;
                    const newWidth = Math.max(30, Math.min(500, startWidth + diff));

                    const colId = findColumnIdFromTh(activeTh);
                    if (colId) {
                        const entry = state.columnConfig.find((c) => c.id === colId);
                        if (entry) {
                            entry.width = Math.max(30, Math.min(500, newWidth));
                            const table = activeTh.closest(".data-table");
                            const px = entry.width + "px";
                            activeTh.style.minWidth = px;
                            activeTh.style.maxWidth = px;
                            activeTh.style.width = px;
                            void activeTh.offsetHeight;
                            if (table) {
                                const colIndex = Array.from(
                                    activeTh.parentElement.children,
                                ).indexOf(activeTh);
                                table.querySelectorAll("tbody tr").forEach((tr) => {
                                    const cell = tr.children[colIndex];
                                    if (cell) {
                                        cell.style.minWidth = px;
                                        cell.style.maxWidth = px;
                                        cell.style.width = px;
                                    }
                                });
                            }
                        }
                    }
                });

                document.addEventListener("mouseup", () => {
                    if (activeHandle) {
                        activeHandle.classList.remove("resizing");
                    }
                    if (activeTh) {
                        document.body.style.cursor = "";
                        document.body.style.userSelect = "";
                        saveColumnConfig(state.columnConfig);
                    }
                    activeHandle = null;
                    activeTh = null;
                });
            }

            function findColumnIdFromTh(thEl) {
                const sortKey = thEl.dataset.sort;
                const model = getColumnModel(state.view);
                if (sortKey) {
                    const col = model.find((m) => m.sortKey === sortKey);
                    if (col) return col.id;
                }
                const text = thEl.textContent.replace("▲", "").replace("▼", "").trim();
                const col = model.find(
                    (m) => m.label.toLowerCase() === text.toLowerCase(),
                );
                return col ? col.id : null;
            }

            // ─── Drag Reorder (manual mouse events, no HTML5 DnD) ───

            let dragReorderTh = null;
            let dragReorderStartX = 0;
            let dragReorderActive = false;
            let dragReorderConfigIdx = -1;

            function wireDragReorder() {
                document.addEventListener("mousedown", (e) => {
                    if (!state.layoutMode) return;
                    const th = e.target.closest("th");
                    if (!th) return;
                    // Don't start drag if clicking on resize handle
                    if (e.target.closest(".col-resize-handle")) return;

                    e.preventDefault();
                    dragReorderTh = th;
                    dragReorderStartX = e.clientX;
                    dragReorderActive = false;
                    dragReorderConfigIdx = findConfigIndexFromTh(th);
                    document.body.style.userSelect = "none";
                });

                document.addEventListener("mousemove", (e) => {
                    if (!state.layoutMode) return;
                    if (!dragReorderTh) return;
                    const moved = Math.abs(e.clientX - dragReorderStartX);
                    // Only start drag after moving 5px to distinguish from click
                    if (!dragReorderActive && moved > 5) {
                        dragReorderActive = true;
                        dragReorderTh.classList.add("dragging");
                        document.body.style.cursor = "grabbing";
                        document.body.style.userSelect = "none";
                    }
                    if (!dragReorderActive) return;

                    // Show drop indicator on nearest th
                    const thead = dragReorderTh.closest("thead");
                    if (!thead) return;
                    const allThs = thead.querySelectorAll("th");
                    allThs.forEach((th) => th.classList.remove("drop-target"));
                    let nearest = null;
                    let nearestDist = Infinity;
                    allThs.forEach((th) => {
                        if (th === dragReorderTh) return;
                        const r = th.getBoundingClientRect();
                        const dist = Math.abs(e.clientX - (r.left + r.width / 2));
                        if (dist < nearestDist) {
                            nearestDist = dist;
                            nearest = th;
                        }
                    });
                    if (nearest) {
                        const r = nearest.getBoundingClientRect();
                        if (e.clientX < r.left + r.width / 2) {
                            nearest.classList.add("drop-target");
                        }
                    }
                });

                document.addEventListener("mouseup", () => {
                    if (!state.layoutMode) return;
                    if (!dragReorderTh) return;

                    if (dragReorderActive) {
                        // Find where to drop
                        const thead = dragReorderTh.closest("thead");
                        if (thead) {
                            const allThs = thead.querySelectorAll("th");
                            let targetTh = null;
                            allThs.forEach((th) => {
                                if (th.classList.contains("drop-target")) {
                                    targetTh = th;
                                }
                            });
                            if (!targetTh) targetTh = allThs[allThs.length - 1];

                            const config = state.columnConfig;
                            const toIdx = findConfigIndexFromTh(targetTh);

                            if (
                                toIdx !== -1 &&
                                dragReorderConfigIdx !== -1 &&
                                toIdx !== dragReorderConfigIdx
                            ) {
                                const [moved] = config.splice(dragReorderConfigIdx, 1);
                                config.splice(toIdx, 0, moved);
                                saveColumnConfig(config);
                                render();
                            }
                        }
                    }

                    // Cleanup
                    dragReorderTh.classList.remove("dragging");
                    if (dragReorderTh.closest("thead")) {
                        dragReorderTh
                            .closest("thead")
                            .querySelectorAll("th")
                            .forEach((th) => th.classList.remove("drop-target"));
                    }
                    document.body.style.cursor = "";
                    document.body.style.userSelect = "";
                    dragReorderTh = null;
                    dragReorderActive = false;
                });
            }

            function findConfigIndexFromTh(thEl) {
                const sortKey = thEl.dataset.sort;
                const model = getColumnModel(state.view);
                if (sortKey) {
                    const col = model.find((m) => m.sortKey === sortKey);
                    if (col) return state.columnConfig.findIndex((c) => c.id === col.id);
                }
                const text = thEl.textContent
                    .replace("\u25B2", "")
                    .replace("\u25BC", "")
                    .trim();
                const col = model.find(
                    (m) => m.label.toLowerCase() === text.toLowerCase(),
                );
                if (col) return state.columnConfig.findIndex((c) => c.id === col.id);
                return -1;
            }

            // ─── Column Config Modal ───

            function openColumnConfig() {
                const modal = document.getElementById("col-config-modal");
                const body = document.getElementById("col-config-body");
                const config = state.columnConfig.map((c) => ({ ...c })); // copy
                const model = getColumnModel(state.view);

                body.innerHTML = config
                    .map((c, i) => {
                        const col = model.find((m) => m.id === c.id);
                        const label = col ? col.label : c.id;
                        return `<label class="col-config-item" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 0">
                <input type="checkbox" class="col-config-checkbox" data-cid="${c.id}" ${c.visible ? "checked" : ""}>
                <span class="col-config-label" style="flex:1;font-size:0.85rem">${label}</span>
              </label>`;
                    })
                    .join("");

                modal.classList.add("open");

                // Close
                document.getElementById("col-config-close").onclick = close;
                modal.addEventListener("click", (e) => {
                    if (e.target === modal) close();
                });

                function close() {
                    modal.classList.remove("open");
                }

                // Reset
                document.getElementById("col-config-reset").onclick = () => {
                    const colModel = getColumnModel(state.view);
                    const defaults = colModel.map((col) => ({
                        id: col.id,
                        visible: true,
                        width: col.defaultWidth,
                    }));
                    saveColumnConfig(defaults);
                    state.columnConfig = defaults;
                    close();
                    render();
                };

                // Select all / Deselect all
                document.getElementById("col-config-select-all").onclick = () => {
                    body.querySelectorAll(".col-config-checkbox").forEach(
                        (cb) => (cb.checked = true),
                    );
                };
                document.getElementById("col-config-deselect-all").onclick = () => {
                    body.querySelectorAll(".col-config-checkbox").forEach(
                        (cb) => (cb.checked = false),
                    );
                };

                // Apply
                document.getElementById("col-config-apply").onclick = () => {
                    body.querySelectorAll(".col-config-checkbox").forEach((cb) => {
                        const entry = config.find((c) => c.id === cb.dataset.cid);
                        if (entry) entry.visible = cb.checked;
                    });
                    state.columnConfig.length = 0;
                    state.columnConfig.push(...config);
                    saveColumnConfig(state.columnConfig);
                    close();
                    render();
                };

                // Close on Escape
                document.addEventListener("keydown", function esc(e) {
                    if (e.key === "Escape") {
                        close();
                        document.removeEventListener("keydown", esc);
                    }
                });
            }

            // ================================================================
            // 6. INITIALIZATION
            // ================================================================

            function init() {
                // ─── View switcher ───
                function setView(view) {
                    state.view = view;
                    state.page = 0;
                    state.sort = "";
                    state.order = "asc";
                    state.search = "";
                    state.selectedServices = [];
                    state.bpmMin = 0;
                    state.bpmMax = 200;
                    state.playsMin = 0;
                    state.playsMax = 200;
                    state.selectedKeys = [];
                    state.selectedGenres = [];
                    state.selectedTags = [];
                    state.fileType = "all";
                    state.commentStatus = "all";
                    state.createdFilter = {
                        enabled: false,
                        condition: "last",
                        value: 30,
                        unit: "days",
                    };
                    state.modifiedFilter = {
                        enabled: false,
                        condition: "last",
                        value: 30,
                        unit: "days",
                    };
                    state.playedFilter = {
                        enabled: false,
                        condition: "last",
                        value: 14,
                        unit: "days",
                    };
                    state.tracksImportFilter = {
                        enabled: false,
                        condition: "last",
                        value: 30,
                        unit: "days",
                    };
                    // Sync date filter DOM with reset state
                    ["created", "modified", "played"].forEach((prefix) => {
                        const check = document.getElementById(prefix + "-check");
                        const cond = document.getElementById(prefix + "-cond");
                        const val = document.getElementById(prefix + "-val");
                        const unit = document.getElementById(prefix + "-unit");
                        if (check) check.checked = false;
                        [cond, val, unit].forEach((el) => {
                            if (el) {
                                el.classList.add("filter-disabled");
                                if (el.tagName === "SELECT") el.value = "last";
                                if (el.tagName === "INPUT" && el.type === "number")
                                    el.value = "30";
                                if (el.tagName === "SELECT" && el.id.includes("unit"))
                                    el.value = "days";
                            }
                        });
                    });
                    state.columnConfig = loadColumnConfig(view);
                    localStorage.setItem("prototype_view", view);

                    // Update search placeholder
                    const si = document.getElementById("search-input");
                    if (si) {
                        si.placeholder =
                            view === "tracks" ? "Search tracks…" : "Search files…";
                        si.value = "";
                    }

                    // Update subtitle
                    const sub = document.getElementById("subtitle-text");
                    if (sub) {
                        const count =
                            view === "tracks" ? ALL_TRACKS.length : ALL_FILES.length;
                        sub.textContent = `${count} ${view === "tracks" ? "tracks" : "files"}`;
                    }

                    // Update active buttons
                    document
                        .querySelectorAll("#view-switcher .filter-btn")
                        .forEach((b) => {
                            b.classList.toggle("active", b.dataset.view === view);
                        });
                    // Clear service filter button active states
                    document
                        .querySelectorAll("#service-filter .filter-btn")
                        .forEach((b) => b.classList.remove("active"));

                    // Reset comment filter button
                    document
                        .querySelectorAll("#comment-filter .filter-btn")
                        .forEach((b) => b.classList.remove("active"));
                    const commentAll = document.querySelector(
                        '#comment-filter .filter-btn[data-value="all"]',
                    );
                    if (commentAll) commentAll.classList.add("active");

                    // Show/hide view-specific filter sections
                    const filesFiltersLeft =
                        document.getElementById("files-filters-left");
                    const filesRightContent =
                        document.getElementById("files-right-content");
                    const tracksFiltersSection = document.getElementById(
                        "tracks-filters-section",
                    );
                    const dateFilters = document.getElementById("date-filters");
                    if (filesFiltersLeft)
                        filesFiltersLeft.style.display = view === "files" ? "" : "none";
                    if (filesRightContent)
                        filesRightContent.style.display = view === "files" ? "" : "none";
                    if (tracksFiltersSection)
                        tracksFiltersSection.style.display =
                            view === "tracks" ? "" : "none";
                    if (dateFilters)
                        dateFilters.style.display = view === "files" ? "" : "none";

                    render();
                }

                // Activate saved view on load
                setView(state.view);

                document
                    .getElementById("view-switcher")
                    .addEventListener("click", (e) => {
                        const btn = e.target.closest(".filter-btn");
                        if (!btn || btn.dataset.view === state.view) return;
                        setView(btn.dataset.view);
                    });

                // Restore service filter buttons from state
                state.selectedServices.forEach((svc) => {
                    const btn = document.querySelector(
                        `#service-filter .filter-btn[data-value="${svc}"]`,
                    );
                    if (btn) btn.classList.add("active");
                });

                // Wire filter toggle
                const toggleBtn = document.getElementById("filter-toggle");
                const filterPanel = document.getElementById("filter-panel");
                if (toggleBtn && filterPanel) {
                    const saved = localStorage.getItem("filterPanelCollapsed_prototype");
                    if (saved === "true") filterPanel.classList.add("collapsed");
                    toggleBtn.addEventListener("click", () => {
                        filterPanel.classList.toggle("collapsed");
                        localStorage.setItem(
                            "filterPanelCollapsed_prototype",
                            filterPanel.classList.contains("collapsed"),
                        );
                    });
                }

                // Wire search (debounced)
                const searchInput = document.getElementById("search-input");
                let searchTimer;
                searchInput.addEventListener("input", () => {
                    clearTimeout(searchTimer);
                    searchTimer = setTimeout(() => {
                        state.search = searchInput.value;
                        state.page = 0;
                        render();
                    }, 250);
                });

                // ─── Multi-select service filter ───
                document
                    .getElementById("service-filter")
                    .addEventListener("click", (e) => {
                        const btn = e.target.closest(".filter-btn");
                        if (!btn) return;
                        const value = btn.dataset.value;
                        const idx = state.selectedServices.indexOf(value);
                        if (idx >= 0) {
                            state.selectedServices.splice(idx, 1);
                            btn.classList.remove("active");
                        } else {
                            state.selectedServices.push(value);
                            btn.classList.add("active");
                        }
                        state.page = 0;
                        render();
                    });

                // Wire BPM dual range
                const bpmMin = document.getElementById("bpm-min");
                const bpmMax = document.getElementById("bpm-max");
                const bpmMinVal = document.getElementById("bpm-min-val");
                const bpmMaxVal = document.getElementById("bpm-max-val");
                const bpmFill = document.getElementById("bpm-fill");
                let bpmTimer;

                function updateBPM() {
                    clearTimeout(bpmTimer);
                    bpmTimer = setTimeout(() => {
                        const min = parseInt(bpmMin.value, 10);
                        const max = parseInt(bpmMax.value, 10);
                        state.bpmMin = Math.min(min, max);
                        state.bpmMax = Math.max(min, max);
                        const pctMin = (state.bpmMin / 200) * 100;
                        const pctMax = (state.bpmMax / 200) * 100;
                        bpmFill.style.left = pctMin + "%";
                        bpmFill.style.width = pctMax - pctMin + "%";
                        bpmMinVal.textContent = state.bpmMin;
                        bpmMaxVal.textContent = state.bpmMax;
                        state.page = 0;
                        render();
                    }, 150);
                }

                bpmMin.addEventListener("input", updateBPM);
                bpmMax.addEventListener("input", updateBPM);

                // Wire key grid
                const minorGrid = document.getElementById("key-grid-minor");
                const majorGrid = document.getElementById("key-grid-major");

                function renderKeyGrid() {
                    const renderKey = (k) => {
                        const isMinor = k.endsWith("m");
                        const cls = isMinor ? "minor" : "major";
                        return `<button class="key-btn ${cls}${state.selectedKeys.includes(k) ? " active" : ""}" data-key="${k}">${k}</button>`;
                    };
                    minorGrid.innerHTML =
                        MINOR_KEYS.map(renderKey).join("") +
                        `<button class="key-btn action" data-key-action="minor-all">ALL</button>` +
                        `<button class="key-btn action" data-key-action="minor-none">NONE</button>`;
                    majorGrid.innerHTML =
                        MAJOR_KEYS.map(renderKey).join("") +
                        `<button class="key-btn action" data-key-action="major-all">ALL</button>` +
                        `<button class="key-btn action" data-key-action="major-none">NONE</button>`;
                }
                renderKeyGrid();

                function handleKeyClick(e) {
                    const btn = e.target.closest(".key-btn");
                    if (!btn) return;
                    const key = btn.dataset.key;
                    const action = btn.dataset.keyAction;

                    if (action === "minor-all") {
                        state.selectedKeys = [...MINOR_KEYS];
                    } else if (action === "minor-none") {
                        state.selectedKeys = state.selectedKeys.filter(
                            (k) => !k.endsWith("m"),
                        );
                    } else if (action === "major-all") {
                        state.selectedKeys = [...MAJOR_KEYS];
                    } else if (action === "major-none") {
                        state.selectedKeys = state.selectedKeys.filter(
                            (k) => !k.endsWith("d"),
                        );
                    } else if (key) {
                        const idx = state.selectedKeys.indexOf(key);
                        if (idx >= 0) state.selectedKeys.splice(idx, 1);
                        else state.selectedKeys.push(key);
                    }
                    state.page = 0;
                    renderKeyGrid();
                    // Re-wire key events after re-render
                    render();
                }

                minorGrid.addEventListener("click", handleKeyClick);
                majorGrid.addEventListener("click", handleKeyClick);

                // ─── Plays dual range ───
                const playsMin = document.getElementById("plays-min");
                const playsMax = document.getElementById("plays-max");
                const playsMinVal = document.getElementById("plays-min-val");
                const playsMaxVal = document.getElementById("plays-max-val");
                const playsFill = document.getElementById("plays-fill");
                let playsTimer;
                function updatePlays() {
                    clearTimeout(playsTimer);
                    playsTimer = setTimeout(() => {
                        const mn = parseInt(playsMin.value, 10);
                        const mx = parseInt(playsMax.value, 10);
                        state.playsMin = Math.min(mn, mx);
                        state.playsMax = Math.max(mn, mx);
                        const pctMin = (state.playsMin / 200) * 100;
                        const pctMax = (state.playsMax / 200) * 100;
                        playsFill.style.left = pctMin + "%";
                        playsFill.style.width = pctMax - pctMin + "%";
                        playsMinVal.textContent = state.playsMin;
                        playsMaxVal.textContent = state.playsMax;
                        state.page = 0;
                        render();
                    }, 150);
                }
                playsMin.addEventListener("input", updatePlays);
                playsMax.addEventListener("input", updatePlays);

                // ─── File type filter ───
                document
                    .getElementById("filetype-filter")
                    .addEventListener("click", (e) => {
                        const btn = e.target.closest(".filter-btn");
                        if (!btn) return;
                        document
                            .querySelectorAll("#filetype-filter .filter-btn")
                            .forEach((b) => b.classList.remove("active"));
                        btn.classList.add("active");
                        state.fileType = btn.dataset.value;
                        state.page = 0;
                        render();
                    });

                // ─── Comment status filter ───
                document
                    .getElementById("comment-filter")
                    .addEventListener("click", (e) => {
                        const btn = e.target.closest(".filter-btn");
                        if (!btn) return;
                        document
                            .querySelectorAll("#comment-filter .filter-btn")
                            .forEach((b) => b.classList.remove("active"));
                        btn.classList.add("active");
                        state.commentStatus = btn.dataset.value;
                        state.page = 0;
                        render();
                    });

                // ─── Date filters (generic helper for condition + unit) ───
                function wireDateFilter(prefix, stateKey) {
                    const check = document.getElementById(prefix + "-check");
                    const cond = document.getElementById(prefix + "-cond");
                    const val = document.getElementById(prefix + "-val");
                    const unit = document.getElementById(prefix + "-unit");
                    const filter = state[stateKey];

                    function setEnabled(enabled) {
                        // Use CSS class instead of disabled attribute
                        [cond, val, unit].forEach((el) => {
                            if (!enabled) {
                                el.classList.add("filter-disabled");
                            } else {
                                el.classList.remove("filter-disabled");
                            }
                        });
                    }

                    function syncState() {
                        filter.enabled = check.checked;
                        filter.condition = cond.value;
                        filter.value = parseInt(val.value, 10) || 30;
                        filter.unit = unit.value;
                        setEnabled(check.checked);
                        state.page = 0;
                        render();
                    }

                    check.addEventListener("change", syncState);
                    cond.addEventListener("change", syncState);
                    unit.addEventListener("change", syncState);
                    val.addEventListener("change", syncState);
                    val.addEventListener("input", () => {
                        filter.value = parseInt(val.value, 10) || 30;
                        state.page = 0;
                        render();
                    });

                    // Initial sync (set to disabled state initially)
                    setEnabled(false);
                }

                wireDateFilter("created", "createdFilter");
                wireDateFilter("modified", "modifiedFilter");
                wireDateFilter("played", "playedFilter");

                // ─── Tracks import date filter ───
                const tracksImportCheck = document.getElementById("tracks-import-check");
                const tracksImportCond = document.getElementById("tracks-import-cond");
                const tracksImportVal = document.getElementById("tracks-import-val");
                const tracksImportUnit = document.getElementById("tracks-import-unit");

                function syncTracksImport() {
                    const enabled = tracksImportCheck ? tracksImportCheck.checked : false;
                    const condition = tracksImportCond ? tracksImportCond.value : "last";
                    const value =
                        parseInt(tracksImportVal ? tracksImportVal.value : "30", 10) ||
                        30;
                    const unit = tracksImportUnit ? tracksImportUnit.value : "days";
                    if (tracksImportCond) tracksImportCond.disabled = !enabled;
                    if (tracksImportVal) tracksImportVal.disabled = !enabled;
                    if (tracksImportUnit) tracksImportUnit.disabled = !enabled;
                    state.tracksImportFilter = { enabled, condition, value, unit };
                    state.page = 0;
                    render();
                }

                if (tracksImportCheck)
                    tracksImportCheck.addEventListener("change", syncTracksImport);
                if (tracksImportCond)
                    tracksImportCond.addEventListener("change", syncTracksImport);
                if (tracksImportUnit)
                    tracksImportUnit.addEventListener("change", syncTracksImport);
                if (tracksImportVal) {
                    tracksImportVal.addEventListener("change", syncTracksImport);
                    tracksImportVal.addEventListener("input", () => {
                        state.tracksImportFilter = {
                            ...state.tracksImportFilter,
                            value: parseInt(tracksImportVal.value, 10) || 30,
                        };
                        state.page = 0;
                        render();
                    });
                }

                // Initialize state
                state.tracksImportFilter = {
                    enabled: false,
                    condition: "last",
                    value: 30,
                    unit: "days",
                };

                // ─── Genre search + chips ───
                let genreTimer;
                const genreSearch = document.getElementById("genre-search");
                genreSearch.addEventListener("input", () => {
                    clearTimeout(genreTimer);
                    genreTimer = setTimeout(() => {
                        const q = genreSearch.value.toLowerCase().trim();
                        if (!q) return;
                        const match = GENRES.find(
                            (g) =>
                                g.toLowerCase().includes(q) &&
                                !state.selectedGenres.includes(g),
                        );
                        if (match) {
                            state.selectedGenres.push(match);
                            state.page = 0;
                            genreSearch.value = "";
                            renderGenreChips();
                            render();
                        }
                    }, 300);
                });

                // ─── Tag search + chips ───
                let tagTimer;
                const tagSearch = document.getElementById("tag-search");
                tagSearch.addEventListener("input", () => {
                    clearTimeout(tagTimer);
                    tagTimer = setTimeout(() => {
                        const q = tagSearch.value.toLowerCase().trim();
                        if (!q) return;
                        const match = TAG_NAMES.find(
                            (t) =>
                                t.toLowerCase().includes(q) &&
                                !state.selectedTags.includes(t),
                        );
                        if (match) {
                            state.selectedTags.push(match);
                            state.page = 0;
                            tagSearch.value = "";
                            renderTagChips();
                            render();
                        }
                    }, 300);
                });

                // ─── Delegated click for chip remove ───
                document.addEventListener("click", (e) => {
                    const genreX = e.target.closest("[data-genre]");
                    if (genreX) {
                        state.selectedGenres = state.selectedGenres.filter(
                            (g) => g !== genreX.dataset.genre,
                        );
                        state.page = 0;
                        renderGenreChips();
                        render();
                    }
                    const tagX = e.target.closest("[data-tag]");
                    if (tagX) {
                        state.selectedTags = state.selectedTags.filter(
                            (t) => t !== tagX.dataset.tag,
                        );
                        state.page = 0;
                        renderTagChips();
                        render();
                    }
                });
            }

            // Kick off
            document.addEventListener("DOMContentLoaded", init);
        </script>
    </body>
</html>
