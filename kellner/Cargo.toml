[workspace]

[package]
name = "kellner"
version = "0.1.0"
edition = "2024"
description = "Local cross-platform companion for the music stack — Backpack upkeep, library backups to music-api, Traktor collection.nml upload, downloads"

[features]
# The tray / menu-bar widget is opt-in: the Linux CI and headless hosts build
# without GTK / appindicator system libraries (issue #368).
default = []
tray = ["dep:tray-icon"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "5"
rand = "0.8"
hex = "0.4"
url = "2"
# Optional GUI backend for the tray/menu-bar widget (`--features tray`).
tray-icon = { version = "0.26", optional = true }
# Library backup (#365): canonicalise (clear Comment) + SHA-256 object key.
lofty = "0.20"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Integration tests build comment-variant fixtures with the same tag writer.
lofty = "0.20"
# The offline mock re-hashes PUT bodies + parses the check body.
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
# `net`+`io-util` are needed by the offline mock-hub integration tests (tests/pair_flow.rs).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

# The shipped binaries are downloaded over the network, not built by the user, so
# build time matters less than size — the release artefacts are what people fetch
# from the hub (see plans/proposed/kellner-downloads.md). Measured effect is in the
# release PR: lto + strip + one codegen unit on top of a tuned opt-level.
# `opt-level = "s"` is the one trade-off here: kellner hashes the whole library
# during `backup`, so if that ever feels slow, dropping this line is the first knob.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
