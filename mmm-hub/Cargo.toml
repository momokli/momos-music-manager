[package]
name = "mmm-hub"
version = "0.1.0"
edition = "2024"
description = "MMM Hub — multi-user music ingest + exploration service"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
urlencoding = "2"
dotenvy = "0.15"
bcrypt = "0.15"
askama = "0.14"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7", features = ["io"] }
# Traktor collection.nml parsing (read-only XML).
roxmltree = "0.20"

# EffNet audio embeddings (Discogs-EffNet via ONNX Runtime). Optional so the
# default/CI build stays light; enable with `--features effnet`.
ort = { version = "2.0.0-rc.13", optional = true }
rustfft = { version = "6", optional = true }

[features]
effnet = ["dep:ort", "dep:rustfft"]

[dev-dependencies]
tempfile = "3"
serde_json = "1"
