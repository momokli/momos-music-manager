<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}MMM Hub{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      nav.hub-nav {
        border-bottom: 1px solid var(--pico-muted-border-color);
      }
      nav.hub-nav a[aria-current="page"] {
        font-weight: 700;
        text-decoration: underline;
        text-underline-offset: 0.3rem;
      }
      .hub-badge {
        display: inline-block;
        font-size: 0.72rem;
        padding: 0.1rem 0.5rem;
        border-radius: 1rem;
        vertical-align: middle;
      }
      .hub-badge-ok {
        background: #123c22;
        color: #5fe08a;
      }
      .hub-badge-no {
        background: #3a1f22;
        color: #ff9a9a;
      }
      .hub-flash {
        padding: 0.6rem 0.8rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
      .hub-flash-ok {
        background: #123c22;
        color: #5fe08a;
      }
      .hub-flash-err {
        background: #3a1f22;
        color: #ff9a9a;
      }
      .hub-muted {
        color: var(--pico-muted-color);
      }
      .hub-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      .hub-actions form {
        margin: 0;
      }
      .hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        gap: 1rem;
      }
      .hub-stat {
        margin: 0;
        text-align: center;
      }
      .hub-stat h2 {
        margin: 0;
        font-size: 1.8rem;
      }
      .hub-stat p {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
      }
      .hub-row-actions form {
        display: inline;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <nav class="container-fluid hub-nav">
      <ul>
        <li><strong><a href="/">MMM Hub</a></strong></li>
        <li>
          <a href="/" {% if nav.active == "dashboard" %}aria-current="page"{% endif %}>Übersicht</a>
        </li>
        <li>
          <a href="/me/playlists" {% if nav.active == "playlists" %}aria-current="page"{% endif %}>Playlists</a>
        </li>
        <li>
          <a href="/search" {% if nav.active == "search" %}aria-current="page"{% endif %}>Suche</a>
        </li>
        <li>
          <a href="/sql" {% if nav.active == "sql" %}aria-current="page"{% endif %}>SQL</a>
        </li>
      </ul>
      <ul>
        <li>
          {% if nav.spotify_connected %}
          <span class="hub-badge hub-badge-ok" title="{% if nav.spotify_label != "" %}{{ nav.spotify_label }}{% endif %}">Spotify verbunden</span>
          {% else %}
          <a href="/api/hub/services/spotify/connect"><span class="hub-badge hub-badge-no">Spotify verbinden</span></a>
          {% endif %}
        </li>
        <li><a href="/user/{{ nav.slug }}">@{{ nav.slug }}</a></li>
        <li>
          <form method="post" action="/logout">
            <button class="outline secondary" type="submit">Logout</button>
          </form>
        </li>
      </ul>
    </nav>

    <main class="container">
      {% block flash %} {% if flash != "" %}
      <article class="hub-flash hub-flash-ok" role="status">{{ flash }}</article>
      {% endif %} {% endblock %} {% block content %}{% endblock %}
    </main>
  </body>
</html>
