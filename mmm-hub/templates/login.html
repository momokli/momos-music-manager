{% extends "auth.html" %} {% block title %}Login — MMM Hub{% endblock %} {% block content
%}
<h1>MMM Hub</h1>
<p class="hub-muted">Login</p>
{% if error != "" %}
<p class="hub-flash-err">{{ error }}</p>
{% endif %}
<form method="post" action="/login">
    <input name="username" placeholder="Benutzername" autofocus required />
    <input name="password" type="password" placeholder="Passwort" required />
    <button type="submit">Einloggen</button>
</form>
{% if registration_open %}
<p class="hub-muted">Noch keinen Account? <a href="/signup">Registrieren</a></p>
{% endif %} {% endblock %}
