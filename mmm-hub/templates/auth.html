<!doctype html>
<html lang="de" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Spelunke{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <style>
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      article.hub-auth {
        width: min(24rem, 92vw);
      }
      article.hub-auth h1 {
        margin-bottom: 0.25rem;
      }
      .hub-muted {
        color: var(--pico-muted-color);
      }
      .hub-flash-err {
        background: #3a1f22;
        color: #ff9a9a;
        padding: 0.6rem 0.8rem;
        border-radius: 0.5rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <article class="hub-auth">{% block content %}{% endblock %}</article>
    </main>
  </body>
</html>
